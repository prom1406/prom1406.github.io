<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182D">
<title>متابعة المغادرة — حجاج 1447هـ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#07182D;--navy2:#0B2342;--navy3:#12335E;
  --gold:#C5A059;--gold2:#E3C98A;--green:#006C35;--ok:#34C47A;--sky:#0EA5E9;--red:#E5484D;--amber:#F5A524;
  --bg:#07182D;--bg2:radial-gradient(1200px 600px at 85% -10%,rgba(14,165,233,.16),transparent 60%),radial-gradient(900px 500px at 5% 0%,rgba(197,160,89,.13),transparent 55%),linear-gradient(180deg,#07182D,#061325);
  --ink:#EAF1FA;--mut:#93A6BF;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);
  --line:rgba(197,160,89,.22);--line2:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;--nav-h:64px;
}
[data-theme=light]{
  --bg:#F4F1EA;--bg2:linear-gradient(180deg,#F7F4EE,#EDE8DC);--ink:#0B1B30;--mut:#5A6B82;
  --card:#FFFFFF;--card2:#F3EFE5;--line:rgba(7,24,45,.14);--line2:rgba(7,24,45,.08);--shadow:0 8px 24px rgba(7,24,45,.10);
  --ok:#0B8A4B;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100vh;background:var(--bg);background-image:var(--bg2);background-attachment:fixed;color:var(--ink);
  font-family:'Tajawal','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
[hidden]{display:none!important}

/* ---------- Navigation ---------- */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:0 22px;height:var(--nav-h);
  background:linear-gradient(180deg,rgba(7,24,45,.96),rgba(7,24,45,.86));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme=light] .nav{background:rgba(255,255,255,.9)}
.brand{display:flex;align-items:center;gap:11px;min-width:190px}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#8E6E32);color:#07182D;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.brand b{display:block;font-size:15.5px;letter-spacing:.2px}
.brand small{display:block;color:var(--gold);font-size:11.5px;margin-top:-2px}
.tabs{display:flex;gap:6px;margin-inline:auto;padding:5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;color:var(--mut);font-weight:600;transition:.25s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.tab svg{width:18px;height:18px;flex:none}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--navy3),#0C4A7A);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(197,160,89,.4);animation:glow 2.4s ease-in-out infinite}
[data-theme=light] .tab.active{color:#fff}
.tab.active::after{content:"";position:absolute;top:6px;inset-inline-start:7px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(197,160,89,.7);animation:ping 1.8s infinite}
.tab.active svg{margin-inline-start:6px}
.tab .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--gold),0 0 8px rgba(197,160,89,.25)}50%{box-shadow:0 0 0 1px var(--gold2),0 0 22px rgba(14,165,233,.55)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(197,160,89,.7)}80%,100%{box-shadow:0 0 0 9px rgba(197,160,89,0)}}
.tools{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:flex-end}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding:0 6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,196,122,.6);animation:ping2 2s infinite}
.live.err i{background:var(--red);animation:none}
.live.load i{background:var(--sky)}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(52,196,122,.55)}80%,100%{box-shadow:0 0 0 8px rgba(52,196,122,0)}}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--card);border:1px solid var(--line2);cursor:pointer;transition:.2s}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}
.ibtn svg{width:18px;height:18px}
.ibtn.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(-360deg)}}

/* ---------- Layout ---------- */
main{max-width:1500px;margin:0 auto;padding:22px 22px 60px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;position:relative}
.hero h1{margin:0;font-size:28px;letter-spacing:.2px}
.hero h1 span{color:var(--gold)}
.hero p{margin:4px 0 0;color:var(--mut)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(135deg,var(--gold),#A98440);color:#07182D;border-color:transparent}
.btn.green{background:var(--green);border-color:transparent;color:#fff}
.btn.sky{background:rgba(14,165,233,.16);border-color:rgba(14,165,233,.5);color:var(--sky)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.panel h2{margin:0 0 12px;font-size:16.5px;display:flex;align-items:center;gap:9px}
.panel h2::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--gold)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.grid2.even{grid-template-columns:1fr 1fr}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2,.grid2.even,.cols2{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{position:relative;padding:15px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line2);overflow:hidden;cursor:default;box-shadow:var(--shadow)}
.kpi::after{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--gold));opacity:.13}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent,var(--gold))}
.kpi .l{color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:32px;font-weight:800;line-height:1.15;margin-top:4px;color:var(--accent,var(--ink));font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px;min-height:18px}
.kpi.gold{--accent:var(--gold)}.kpi.ok{--accent:var(--ok)}.kpi.sky{--accent:var(--sky)}.kpi.red{--accent:var(--red)}.kpi.amber{--accent:var(--amber)}
.kpi.red.pulse{animation:redpulse 2s infinite}
@keyframes redpulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 1px var(--red),0 0 22px rgba(229,72,77,.35)}}
.bar{height:6px;border-radius:9px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--ok));border-radius:9px;transition:width .6s}

/* ---------- Alert bar ---------- */
.alertbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;margin-bottom:16px;background:linear-gradient(90deg,rgba(229,72,77,.18),rgba(229,72,77,.06));border:1px solid rgba(229,72,77,.5);cursor:pointer}
.alertbar b{color:#ff8f93}
[data-theme=light] .alertbar b{color:#b3262b}
.alertbar .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:ping3 1.4s infinite}
@keyframes ping3{0%{box-shadow:0 0 0 0 rgba(229,72,77,.7)}80%,100%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
.stale{background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.5);padding:9px 14px;border-radius:12px;margin-bottom:14px;font-size:13.5px}

/* ---------- Flight rail ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.fl{scroll-snap-align:start;flex:0 0 232px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);cursor:pointer;transition:.2s;position:relative}
.fl:hover{border-color:var(--gold)}
.fl.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(197,160,89,.25)}
.fl .t{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.fl .t .no{font-size:17px;letter-spacing:.5px;color:var(--gold2)}
[data-theme=light] .fl .t .no{color:#8A6A2A}
.fl .m{color:var(--mut);font-size:12.5px;margin:2px 0 8px;display:flex;justify-content:space-between;gap:6px}
.fl .cd{font-size:18px;font-weight:700;margin:6px 0}
.fl .row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:5px;color:var(--mut)}
.fl.danger{border-color:rgba(229,72,77,.55)}
.fl.warn{border-color:rgba(245,165,36,.5)}
.cd{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cd.neg{color:var(--mut)}
.cd.crit{color:var(--red);font-weight:800}
.cd.warn{color:var(--amber);font-weight:700}

/* ---------- Toolbar & table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.field{position:relative}
.toolbar input[type=search],.toolbar select,.set input,.set select{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-width:140px;outline:none}
.toolbar input[type=search]{min-width:240px;padding-inline-start:36px}
.field svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut);pointer-events:none}
.toolbar input:focus,.toolbar select:focus,.set input:focus,.set select:focus{border-color:var(--gold)}
select option{background:#0B2342;color:#EAF1FA}
[data-theme=light] select option{background:#fff;color:#0B1B30}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mut);user-select:none}
.sw input{accent-color:var(--gold);width:16px;height:16px}
.sp{flex:1}
.bulk{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:rgba(197,160,89,.14);border:1px solid var(--line);margin-bottom:10px}
.tablewrap{overflow:auto;border-radius:12px;border:1px solid var(--line2);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
thead th{position:sticky;top:0;z-index:2;background:#0C2646;color:var(--gold2);text-align:start;padding:11px 12px;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line)}
[data-theme=light] thead th{background:#E8E1D0;color:#5A4520}
thead th.sort{cursor:pointer}thead th.sort:hover{color:#fff}
[data-theme=light] thead th.sort:hover{color:#000}
thead th .ar{opacity:.6;margin-inline-start:4px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr.r:hover td{background:rgba(255,255,255,.04)}
tbody tr.r.done td{opacity:.72}
tbody tr.r.danger td:first-child{box-shadow:inset -3px 0 0 var(--red)}
tbody tr.r.warn td:first-child{box-shadow:inset -3px 0 0 var(--amber)}
tbody tr.r.syncing td{background:rgba(14,165,233,.08)}
.nm{font-weight:700;cursor:pointer}
.sub{color:var(--mut);font-size:12.5px}
.nat{display:flex;align-items:center;gap:8px;white-space:nowrap}
.flag{width:26px;height:18px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18);background:var(--card2);flex:none}
.flag.ph{display:inline-grid;place-items:center;font-size:10px;color:var(--mut)}
.pp{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(0,108,53,.22)}
.chip.info{color:var(--sky);background:rgba(14,165,233,.14)}
.chip.warn{color:var(--amber);background:rgba(245,165,36,.14)}
.chip.danger{color:#ff7b80;background:rgba(229,72,77,.16)}
[data-theme=light] .chip.danger{color:#B3262B}
.chip.mut{color:var(--mut);background:var(--line2)}
.chip.sync{color:var(--sky);background:rgba(14,165,233,.14)}
tr.detail td{background:rgba(255,255,255,.03)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px}
.kv div{font-size:13px}.kv b{color:var(--gold2);display:block;font-weight:600;font-size:12px}
.more{text-align:center;padding:12px}
.empty{padding:40px;text-align:center;color:var(--mut)}

/* ---------- Dashboard bits ---------- */
.chartbox{position:relative;height:270px}
.nxt{display:flex;flex-direction:column;gap:8px}
.nx{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line2)}
.nx .no{font-weight:800;color:var(--gold2);min-width:66px}
[data-theme=light] .nx .no{color:#8A6A2A}
.nx .i{flex:1;min-width:0}.nx .i small{display:block;color:var(--mut)}
.nx .c{font-weight:700}
.nx h3,.cols2 h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.rings{display:flex;gap:22px;justify-content:space-around;flex-wrap:wrap;padding:6px 0}
.ring{text-align:center}
.ring svg{width:140px;height:140px;transform:rotate(90deg) scaleX(-1)}
.ring .tx{margin-top:-96px;height:96px;display:grid;place-content:center;font-size:26px;font-weight:800}
.ring .tx small{font-size:12px;color:var(--mut);font-weight:500}
.ring .lb{margin-top:6px;color:var(--mut);font-size:13.5px}
.natl{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto;padding-inline-end:4px}
.nr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.nr .nn{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px}
.nr .bar{height:5px}
.nr .bar>i{background:linear-gradient(90deg,var(--sky),var(--gold))}
.feed .nx{border-inline-start:3px solid var(--red)}

/* ---------- Modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(3,10,20,.65);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0A2039;border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
[data-theme=light] .modal{background:#fff}
.modal h3{margin:0 0 14px;font-size:19px;color:var(--gold2)}
[data-theme=light] .modal h3{color:#7A5A1E}
.modal .act{display:flex;gap:10px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.set label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.set label.full{grid-column:1/-1}
.set input,.set select{width:100%;color:var(--ink)}
.set h4{grid-column:1/-1;margin:10px 0 0;color:var(--gold2);font-size:14px;border-bottom:1px solid var(--line2);padding-bottom:4px}
@media(max-width:640px){.set{grid-template-columns:1fr}}
.toasts{position:fixed;bottom:86px;inset-inline-start:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:12px;background:#0C2646;border:1px solid var(--line);box-shadow:var(--shadow);max-width:360px;animation:tin .3s}
.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--red)}.toast.warn{border-color:var(--amber)}
[data-theme=light] .toast{background:#fff}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .nav{padding:0 12px;gap:8px;backdrop-filter:none;-webkit-backdrop-filter:none;background:#07182D}
  [data-theme=light] .nav{background:#fff}
  .brand{min-width:0}.brand small,.brand b{display:none}
  .tools{min-width:0}.live em{display:none}
  .tabs{position:fixed;bottom:12px;inset-inline:12px;margin:0;justify-content:space-around;background:#0C2646;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:60;border-color:var(--line)}
  [data-theme=light] .tabs{background:#fff}
  .tab{padding:9px 12px}.tab span.tl{display:none}.tab.active span.tl{display:inline}
  main{padding:16px 12px 100px}
  .toasts{bottom:90px}
}
@media(max-width:760px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .v{font-size:26px}
  table,thead,tbody,tr,td{display:block;min-width:0}
  thead{display:none}
  .tablewrap{border:0;max-height:none}
  tbody tr.r{background:var(--card2);border:1px solid var(--line2);border-radius:14px;margin-bottom:10px;padding:6px 4px}
  tbody td{border:0;display:flex;justify-content:space-between;gap:12px;padding:6px 12px}
  tbody td::before{content:attr(data-l);color:var(--mut);font-size:12.5px}
  tbody td[data-l=""]::before{display:none}
  tr.detail td{display:block}
  .toolbar input[type=search]{min-width:100%}
  .hero h1{font-size:23px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .nav,.toolbar,.hero-actions,.bulk,.more,.rail,.toasts,.tabs,.btn,.alertbar{display:none!important}
  body{background:#fff;color:#000}.panel,.kpi{box-shadow:none;border-color:#ccc}
  .tablewrap{max-height:none;overflow:visible}thead th{position:static;background:#eee;color:#000}
}

</style>
</head>
<body data-page="departure">
<header id="nav"></header>
<main id="app"></main>
<script>
/* =====================================================================
   منظومة تحركات الحجاج 1447هـ — الطبقة الأساسية (منطق بحت بلا DOM)
   تحليل CSV، اكتشاف الأعمدة، الدول والأعلام، الحالات، العدّ التنازلي
   ===================================================================== */
(function (root) {
'use strict';

/* ---------------- الإعدادات الافتراضية ---------------- */
const DEFAULTS = {
  arrival:   { csv: '', checkHeader: 'Check'    },   // الصق رابط CSV من الإعدادات (لا تضعه في الكود: المستودع عام)
  departure: { csv: '', checkHeader: 'Check_De' },
  webapp: '',            // رابط Google Apps Script (…/exec)
  token: '',             // الرمز السري المطابق لما في Code.gs
  readVia: 'csv',        // csv = الرابط المنشور | webapp = القراءة عبر Apps Script (فورية وخاصة)
  refreshSec: 30,
  dateOrder: 'DMY',      // ترتيب التاريخ في الجدول: DMY أو MDY
  tz: '+03:00',          // توقيت الرحلات (الرياض)
  criticalH: 3,          // ساعات: الرحلة "وشيكة/حرجة"
  warnH: 12,             // ساعات: الرحلة "قريبة"
  lateH: 2,              // ساعات بعد الهبوط قبل اعتبار التسكين "متأخراً"
  map: { arrival: {}, departure: {} }   // ربط يدوي: الحقل → اسم العمود
};

/* ---------------- أدوات النصوص ---------------- */
const toLatinDigits = s => String(s == null ? '' : s)
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

// تطبيع عربي/إنجليزي للمقارنة: يزيل التشكيل والمسافات والرموز ويوحّد الهمزات والتاء المربوطة
const normAr = s => toLatinDigits(s).toLowerCase()
  .replace(/[ً-ٰٟـ]/g, '')
  .replace(/[إأآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
  .replace(/[^a-z0-9؀-ۿ]+/g, '');

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- محلل CSV (RFC 4180) ---------------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = String(text).replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

  const c = { iso2: p[0], iso3: p[1], ar: p[2], en: p[3] };

    const k = normAr(a);
    if (k && !CIDX.has(k)) CIDX.set(k, c);

function countryOf(str) {
  const k = normAr(str); if (!k) return null;
  if (CIDX.has(k)) return CIDX.get(k);
  const s = k.replace(/^ال/, ''); if (CIDX.has(s)) return CIDX.get(s);
  if (s.length < 3) return null;
  // مطابقة بالبادئة تلتقط النسبة: «مصري» ↔ «مصر»، «Pakistani» ↔ «Pakistan»
  let best = null, bl = 0;
  for (const [a, c] of CLONG) {
    if (s.startsWith(a) || a.startsWith(s)) { const l = Math.min(a.length, s.length); if (l > bl) { best = c; bl = l; } }
  }
  return best;
}

function findHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    if (rows[i].filter(c => String(c).trim() !== '').length >= 3) return i;
  }
  return -1;
}

function buildMapping(headers, kind, overrides, checkHeader) {
  const H = headers.map(normAr);
  const map = {}; const used = new Set();
  // عمود التأكيد (Check / Check_De): مطابقة تامة بعد التطبيع
  const ck = normAr(checkHeader);
  let ci = H.findIndex(h => h === ck);
  if (overrides && overrides.check) { const j = headers.indexOf(overrides.check); if (j >= 0) ci = j; }
  if (ci >= 0) { map.check = ci; used.add(ci); }
  // الربط اليدوي أولاً
  Object.keys(overrides || {}).forEach(f => {
    if (f === 'check' || !FIELDS[f]) return;
    const j = headers.indexOf(overrides[f]);
    if (j >= 0 && !used.has(j)) { map[f] = j; used.add(j); }
  });
  const cand = [];
  Object.keys(FIELDS).forEach(f => {
    if (map[f] != null) return;
    H.forEach((h, i) => {
      if (used.has(i) || !h || h.startsWith('check')) return;
      let sc = 0;
      FIELDS[f].nal.forEach(a => {
        if (h === a) sc = Math.max(sc, 100);
        else if (a.length >= 4 && h.includes(a)) sc = Math.max(sc, 40 + a.length);
      });
      if (!sc) return;
      if (f === 'date' || f === 'time') {
        const arr = /arriv|وصول/.test(h), dep = /depart|مغادر/.test(h);
        if (kind === 'arrival') { if (arr) sc += 30; if (dep) sc -= 60; }
        else { if (dep) sc += 30; if (arr) sc -= 60; }
      }
      if (sc > 0) cand.push({ f, i, sc });
    });
  });
  cand.sort((a, b) => b.sc - a.sc || a.i - b.i);
  cand.forEach(c => { if (map[c.f] == null && !used.has(c.i)) { map[c.f] = c.i; used.add(c.i); } });
  return map;
}

function parseDateParts(str, order) {
  str = toLatinDigits(str).trim(); if (!str) return null;
  let m;
  if ((m = str.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2}))?/)))
    return { y: +m[1], mo: +m[2], d: +m[3], h: m[4] != null ? +m[4] : null, mi: m[5] != null ? +m[5] : null };
  if ((m = str.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})\s*([APap]\.?[Mm]\.?|ص|م)?)?/))) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    let d, mo; if (order === 'MDY') { mo = a; d = b; } else { d = a; mo = b; }
    if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; }
    let h = m[4] != null ? +m[4] : null; const ap = m[6];
    if (h != null && ap) { const pm = /^[Pp]|م/.test(ap); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    return { y, mo, d, h, mi: m[5] != null ? +m[5] : null };
  }
  const t = Date.parse(str);
  if (!isNaN(t)) { const d = new Date(t); return { y: d.getFullYear(), mo: d.getMonth() + 1, d: d.getDate(), h: null, mi: null }; }
  return null;
}
function parseTimeParts(str) {
  str = toLatinDigits(str).trim(); if (!str) return null;
  let m = str.match(/(\d{1,2})\s*[:.]\s*(\d{2})(?::\d{2})?\s*([APap]\.?[Mm]\.?|ص|م)?/);
  if (!m) { const m4 = str.match(/^(\d{2})(\d{2})$/); if (m4) m = [null, m4[1], m4[2], null]; }
  if (!m) return null;
  let h = +m[1]; const mi = +m[2]; const ap = m[3];
  if (ap) { const pm = /^[Pp]|م/.test(ap); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  if (h > 23 || mi > 59) return null;
  return { h, mi };
}
const p2 = n => String(n).padStart(2, '0');
function buildWhen(dateStr, timeStr, order, tz) {
  const d = parseDateParts(dateStr, order); if (!d) return { when: null, approx: false };
  let h = d.h, mi = d.mi, approx = false;
  if (h == null) { const t = parseTimeParts(timeStr); if (t) { h = t.h; mi = t.mi; } }
  if (h == null) { h = 12; mi = 0; approx = true; }
  const dt = new Date(d.y + '-' + p2(d.mo) + '-' + p2(d.d) + 'T' + p2(h) + ':' + p2(mi) + ':00' + tz);
  return { when: isNaN(dt) ? null : dt, approx };
}
const TZ_NAME = 'Asia/Riyadh';
const fmtDay = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ_NAME }).format(d);
const fmtTime = d => new Intl.DateTimeFormat('en-GB', { timeZone: TZ_NAME, hour: '2-digit', minute: '2-digit', hour12: false }).format(d);

function fmtCountdown(ms) {
  const neg = ms < 0; let s = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
  const hms = p2(h) + ':' + p2(m) + ':' + p2(s);
  return { neg, d, hms, text: (d ? d + 'ي ' : '') + hms };
}

const TRUE_SET = new Set(['true', '1', 'yes', 'y', 'x', 'نعم', 'تم', 'done', 'checked', 'تمالتسكين', 'تمتالمغادره', '✓', '✔', '☑']);
const isTrue = v => { const t = normAr(v) || String(v).trim().toLowerCase(); return TRUE_SET.has(t) || TRUE_SET.has(String(v).trim().toLowerCase()); };

function toRecords(rows, kind, cfg) {
  const hi = findHeaderRow(rows);
  if (hi < 0) return { headers: [], map: {}, records: [], headerRow: 0 };
  const headers = rows[hi].map(h => String(h == null ? '' : h).trim());
  const map = buildMapping(headers, kind, (cfg.map && cfg.map[kind]) || {}, cfg[kind].checkHeader);
  const get = (row, f) => map[f] != null ? String(row[map[f]] == null ? '' : row[map[f]]).trim() : '';
  const records = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(c => String(c).trim() === '')) continue;
    const name = get(row, 'name'), passport = get(row, 'passport'), flight = get(row, 'flight');
    if (!name && !passport && !flight) continue;
    const natRaw = get(row, 'nationality');
    const paxN = parseInt(toLatinDigits(get(row, 'pax')), 10);
    const w = buildWhen(get(row, 'date'), get(row, 'time'), cfg.dateOrder, cfg.tz);
    const keyField = map.passport != null ? 'passport' : (map.name != null ? 'name' : null);
    const r = {
      kind, row: i + 1, name, passport, flight, natRaw,
      country: countryOf(natRaw),
      airline: get(row, 'airline'), date: get(row, 'date'), time: get(row, 'time'),
      when: w.when, approx: w.approx,
      hotel: get(row, 'hotel'), room: get(row, 'room'), group: get(row, 'group'),
      pax: paxN > 0 ? paxN : 1, phone: get(row, 'phone'), terminal: get(row, 'terminal'),
      route: get(row, 'route'), notes: get(row, 'notes'),
      done: map.check != null ? isTrue(row[map.check]) : false,
      key: keyField ? get(row, keyField) : '', keyHeader: keyField ? headers[map[keyField]] : '',
      raw: headers.map((h, j) => [h || ('عمود ' + (j + 1)), String(row[j] == null ? '' : row[j]).trim()]).filter(x => x[1] !== '')
    };
    records.push(r);
  }
  return { headers, map, records, headerRow: hi + 1 };
}

function statusOf(r, now, c) {
  if (r.done) return 'done';
  if (!r.when) return 'nodate';
  const h = (r.when.getTime() - now) / 36e5;
  if (h > c.warnH) return 'upcoming';
  if (h > c.criticalH) return 'soon';
  if (h > 0) return 'critical';
  if (r.kind === 'arrival') return (-h > c.lateH) ? 'late' : 'pending';
  return 'missed';
}
function summarize(recs, now, c) {
  const o = { rows: recs.length, total: 0, done: 0, pending: 0, danger: 0, warn: 0, dangerRows: 0, by: {} };
  for (const r of recs) {

  $('#fNat').onchange = e => { ui.nat = e.target.value; render(); };
  $('#fDay').onchange = e => { ui.day = e.target.value; render(); };
  $('#fReveal').onchange = e => { ui.reveal = e.target.checked; render(); };
  $('#xPrint').onclick = () => window.print();
  $('#xXls').onclick = async () => {
    try { await saveXlsx([{ name: K.title, rows: filtered().map(r => exportRow(kind, r, ui.reveal)) }], 'hajj1447-' + kind + '-' + stamp() + '.xlsx'); toast('تم تصدير Excel', 'ok'); } catch (e) { toast(e.message, 'err'); }
  };
  $('#xPdf').onclick = async () => {
    const rows = filtered(), sm = C.summarize(recs(), Date.now(), S); toast('جارٍ تجهيز PDF…');
    const head = ['#', 'الاسم', 'الجنسية', 'الجواز', 'الرحلة', 'التاريخ', 'الوقت', 'الفندق / الغرفة', 'الحالة'];
    const html = reportHtml({
      title: 'تقرير ' + K.title, sub: rows.length + ' سجل (حسب التصفية الحالية)',
      kpis: [[K.total, sm.total], [K.doneL, sm.done, '#006C35'], [K.openL, sm.pending, '#F5A524'], ['حرجة / متأخرة', sm.danger, '#E5484D'], ['نسبة الإنجاز', sm.pct + '%', '#0EA5E9']],
      head, rows: rows.map((r, i) => [i + 1, r.name, { html: flagImg(r.country) || esc(r.natRaw) }, { html: '<span dir="ltr">' + esc(ui.reveal ? r.passport : mask(r.passport)) + '</span>' }, r.flight, r.when ? C.fmtDay(r.when) : r.date, r.when && !r.approx ? C.fmtTime(r.when) : r.time, (r.hotel + (r.room ? ' / ' + r.room : '')), ST_LABEL[kind][r._st]])
    });
    try { await savePDF(html, 'hajj1447-' + kind + '-' + stamp() + '.pdf', true); toast('تم إنشاء PDF', 'ok'); } catch (e) { toast('تعذّر إنشاء PDF: ' + e.message, 'err'); }
  };
  onData(render); render();
}

/* =====================================================================
   لوحة المؤشرات التنفيذية
   ===================================================================== */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const charts = {};
function chart(id, type, data, extra) {
  const el = $('#' + id); if (!el) return;
  if (typeof Chart === 'undefined') { el.parentNode.innerHTML = '<div class="empty">تعذّر تحميل مكتبة الرسوم (Chart.js) — تحقق من الاتصال</div>'; return; }
  if (charts[id]) { charts[id].data = data; charts[id].update('none'); return; }
  Chart.defaults.font.family = 'Tajawal,Tahoma,sans-serif';
  const tc = css('--mut'), gc = 'rgba(147,166,191,.15)';
  charts[id] = new Chart(el, {
    type, data, options: Object.assign({
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: tc, usePointStyle: true, boxWidth: 8 } }, tooltip: { rtl: true, textDirection: 'rtl' } },
      scales: { x: { stacked: true, ticks: { color: tc }, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { color: tc, precision: 0 }, grid: { color: gc } } }
    }, extra || {})
  });
}
const byDay = R => { const m = new Map(); R.forEach(r => { if (!r.when) return; const k = C.fmtDay(r.when), o = m.get(k) || { done: 0, open: 0 }; if (r.done) o.done += r.pax; else o.open += r.pax; m.set(k, o); }); return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1); };
const ring = (pct, color, label, sub) => { const c = 2 * Math.PI * 54; return '<div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" fill="none" stroke="' + css('--line2') + '" stroke-width="12"/><circle cx="70" cy="70" r="54" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (pct / 100 * c).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg><div class="tx">' + pct + '%<small>' + sub + '</small></div><div class="lb">' + label + '</div></div>'; };

function initDashboard() {
  const app = $('#app');
  app.innerHTML = '<section class="hero"><div><h1>لوحة المؤشرات <span>التنفيذية</span></h1><p>نظرة لحظية على حركة وصول ومغادرة حجاج 1447هـ</p></div><div class="hero-actions"><button class="btn green" id="xXls">' + ICON.xls + 'Excel شامل</button><button class="btn sky" id="xPdf">' + ICON.pdf + 'تقرير PDF</button><button class="btn" id="xPrint">' + ICON.print + 'طباعة</button></div></section>' +
    '<div id="stale"></div><div class="kpis" id="kpis"></div>' +
    '<div class="grid2"><section class="panel"><h2>أقرب الرحلات</h2><div class="cols2"><div><h3>الوصول</h3><div class="nxt" id="nxA"></div></div><div><h3>المغادرة</h3><div class="nxt" id="nxD"></div></div></div></section>' +
    '<section class="panel"><h2>نسب الإنجاز</h2><div class="rings" id="rings"></div></section></div>' +
    '<div class="grid2 even"><section class="panel"><h2>الوصول حسب اليوم</h2><div class="chartbox"><canvas id="chA"></canvas></div></section><section class="panel"><h2>المغادرة حسب اليوم</h2><div class="chartbox"><canvas id="chD"></canvas></div></section></div>' +
    '<div class="grid2"><section class="panel"><h2>حركة الرحلات خلال 24 ساعة القادمة</h2><div class="chartbox"><canvas id="chH"></canvas></div></section><section class="panel"><div class="panel-h"><h2>الجوازات حسب الجنسية</h2><span class="hint" id="natCnt"></span></div><div class="natl" id="nat"></div></section></div>' +
    '<section class="panel"><h2>تنبيهات حرجة تحتاج إجراءً</h2><div class="nxt feed" id="feed"></div></section>';
  let snap = null;

  function nxList(kind) {
    const d = state.data[kind], now = Date.now(); if (!d) return '<div class="empty">—</div>';
    const g = C.groupFlights(d.records).filter(x => x.when && x.done < x.pax && x.when.getTime() > now - 36e5).slice(0, 5);
    return g.length ? g.map(x => '<a class="nx" href="' + kind + '.html?q=' + encodeURIComponent(x.flight) + '"><span class="no">' + esc(x.flight) + '</span><span class="i">' + esc(x.airline || '') + '<small>' + C.fmtDayAr(x.when) + ' · ' + C.fmtTime(x.when) + ' · ' + x.pax + ' فرد</small></span><span class="c"><span class="cd" data-w="' + x.when.getTime() + '"></span></span></a>').join('') : '<div class="empty" style="padding:14px">لا توجد رحلات قادمة</div>';
  }
  function render() {
    const A = state.data.arrival, D = state.data.departure, now = Date.now();
    $('#stale').innerHTML = (state.err.arrival || state.err.departure) ? '<div class="stale">⚠ ' + esc(state.err.arrival || state.err.departure) + (A || D ? ' — تُعرض آخر بيانات محفوظة' : '') + ' <button class="btn sm" id="stSet">الإعدادات</button></div>' : '';
    if ($('#stSet')) $('#stSet').onclick = openSettings;
    if (!A && !D) { $('#kpis').innerHTML = '<div class="empty" style="grid-column:1/-1">' + (state.err.arrival || state.err.departure ? 'تعذّر تحميل البيانات.' : 'جارٍ تحميل البيانات…') + '</div>'; return; }
    const sa = A ? C.summarize(A.records, now, S) : null, sd = D ? C.summarize(D.records, now, S) : null;
    const z = { total: 0, done: 0, pending: 0, danger: 0, dangerRows: 0, pct: 0 };
    const a = sa || z, d = sd || z;
    snap = { a, d };
    const target = (a.dangerRows || !d.dangerRows) ? 'arrival' : 'departure';
    $('#kpis').innerHTML =
      '<div class="kpi gold"><div class="l">إجمالي الحجاج القادمين</div><div class="v">' + a.total + '</div><div class="s">المغادرون: ' + d.total + '</div></div>' +
      '<div class="kpi ok"><div class="l">تم التسكين</div><div class="v">' + a.done + '</div><div class="s">' + a.pct + '% من القادمين</div></div>' +
      '<div class="kpi amber"><div class="l">بانتظار التسكين</div><div class="v">' + a.pending + '</div><div class="s">تستدعي الانتباه: ' + (sa ? sa.warn : 0) + '</div></div>' +
      '<div class="kpi sky"><div class="l">تمت المغادرة</div><div class="v">' + d.done + '</div><div class="s">' + d.pct + '% من المغادرين</div></div>' +
      '<div class="kpi amber"><div class="l">بانتظار المغادرة</div><div class="v">' + d.pending + '</div><div class="s">من أصل ' + d.total + '</div></div>' +
      '<a class="kpi red click' + ((a.dangerRows + d.dangerRows) ? ' pulse' : '') + '" href="' + target + '.html?status=danger"><div class="l">تنبيهات حرجة</div><div class="v">' + (a.dangerRows + d.dangerRows) + '</div><div class="s">وصول ' + a.dangerRows + ' · مغادرة ' + d.dangerRows + '</div></a>';
    $('#nxA').innerHTML = nxList('arrival'); $('#nxD').innerHTML = nxList('departure');
    $('#rings').innerHTML = ring(a.pct, '#34C47A', 'التسكين', 'مُسكَّن') + ring(d.pct, '#0EA5E9', 'المغادرة', 'غادر');

    const col = { ok: '#006C35', open: '#C5A059', sky: '#0EA5E9' };
    const dA = A ? byDay(A.records) : [], dD = D ? byDay(D.records) : [];
    const lab = ds => ds.map(x => x[0].slice(5).replace('-', '/'));
    chart('chA', 'bar', { labels: lab(dA), datasets: [{ label: 'تم التسكين', data: dA.map(x => x[1].done), backgroundColor: col.ok, borderRadius: 4 }, { label: 'بانتظار التسكين', data: dA.map(x => x[1].open), backgroundColor: col.open, borderRadius: 4 }] });
    chart('chD', 'bar', { labels: lab(dD), datasets: [{ label: 'تمت المغادرة', data: dD.map(x => x[1].done), backgroundColor: col.sky, borderRadius: 4 }, { label: 'بانتظار المغادرة', data: dD.map(x => x[1].open), backgroundColor: col.open, borderRadius: 4 }] });
    const h0 = Math.floor(now / 36e5) * 36e5, hl = [], ha = new Array(24).fill(0), hd = new Array(24).fill(0);
    for (let i = 0; i < 24; i++) hl.push(C.fmtTime(new Date(h0 + i * 36e5)));
    const put = (R, arr) => R && R.forEach(r => { if (!r.when) return; const i = Math.floor((r.when.getTime() - h0) / 36e5); if (i >= 0 && i < 24) arr[i] += r.pax; });
    put(A && A.records, ha); put(D && D.records, hd);
    chart('chH', 'bar', { labels: hl, datasets: [{ label: 'وصول', data: ha, backgroundColor: col.ok, borderRadius: 4 }, { label: 'مغادرة', data: hd, backgroundColor: col.sky, borderRadius: 4 }] }, { scales: { x: { stacked: false, ticks: { color: css('--mut'), maxRotation: 0, autoSkip: true }, grid: { display: false } }, y: { stacked: false, beginAtZero: true, ticks: { color: css('--mut'), precision: 0 }, grid: { color: 'rgba(147,166,191,.15)' } } } });

    // الجنسيات
    const all = [...(A ? A.records : [])]; const seen = new Set(all.map(r => r.key).filter(Boolean));
    (D ? D.records : []).forEach(r => { if (!r.key || !seen.has(r.key)) all.push(r); });
    const nm = new Map(); all.forEach(r => { const k = r.country ? r.country.iso2 : '?'; const o = nm.get(k) || { c: r.country, n: 0 }; o.n += r.pax; nm.set(k, o); });
    const arr = [...nm.values()].sort((x, y) => y.n - x.n), mx = arr.length ? arr[0].n : 1, tot = arr.reduce((s, x) => s + x.n, 0) || 1;
    $('#natCnt').textContent = arr.length + ' جنسية · ' + tot + ' فرد';
    $('#nat').innerHTML = arr.map(x => '<div class="nr">' + (x.c ? '<img class="flag" loading="lazy" alt="" src="' + C.flagUrl(x.c.iso2, 40) + '" onerror="this.style.visibility=\'hidden\'">' : '<span class="flag ph">؟</span>') + '<div><div class="nn"><span>' + esc(x.c ? x.c.ar : 'غير محدد') + '</span><b class="num">' + x.n + ' · ' + Math.round(x.n / tot * 100) + '%</b></div><div class="bar"><i style="width:' + (x.n / mx * 100) + '%"></i></div></div><span></span></div>').join('') || '<div class="empty">—</div>';

    // التنبيهات
    const items = []; [['arrival', A], ['departure', D]].forEach(([k, d]) => d && d.records.forEach(r => { if (ST[r._st] && ST[r._st].cls === 'danger') items.push({ k, r }); }));
    items.sort((x, y) => ST[y.r._st].lv - ST[x.r._st].lv || (x.r.when || 0) - (y.r.when || 0));
    $('#feed').innerHTML = items.length ? items.slice(0, 12).map(({ k, r }) => '<a class="nx" href="' + k + '.html?q=' + encodeURIComponent(r.passport || r.name) + '"><span class="no">' + esc(r.flight || '—') + '</span><span class="i">' + esc(r.name || '—') + '<small>' + (k === 'arrival' ? 'وصول' : 'مغادرة') + ' · ' + esc(r.country ? r.country.ar : r.natRaw) + '</small></span><span class="chip danger">' + esc(ST_LABEL[k][r._st]) + '</span><span class="c">' + (r.when ? '<span class="cd" data-w="' + r.when.getTime() + '"></span>' : '') + '</span></a>').join('') + (items.length > 12 ? '<div class="hint" style="padding:6px">+ ' + (items.length - 12) + ' أخرى — افتح صفحة الوصول/المغادرة وصفِّ بـ «حرجة»</div>' : '') : '<div class="empty" style="padding:18px">لا توجد تنبيهات حرجة حالياً ✓</div>';
    tick();
  }
  $('#xPrint').onclick = () => window.print();
  $('#xXls').onclick = async () => {
    const A = state.data.arrival, D = state.data.departure; if (!A && !D) return toast('لا توجد بيانات بعد', 'warn');
    const now = Date.now(), sheets = [];
    const sm = snap || { a: {}, d: {} };
    sheets.push({ name: 'ملخص', rows: [{ 'المؤشر': 'إجمالي القادمين', 'القيمة': sm.a.total }, { 'المؤشر': 'تم التسكين', 'القيمة': sm.a.done }, { 'المؤشر': 'بانتظار التسكين', 'القيمة': sm.a.pending }, { 'المؤشر': 'إجمالي المغادرين', 'القيمة': sm.d.total }, { 'المؤشر': 'تمت المغادرة', 'القيمة': sm.d.done }, { 'المؤشر': 'بانتظار المغادرة', 'القيمة': sm.d.pending }, { 'المؤشر': 'سجلات حرجة', 'القيمة': (sm.a.dangerRows || 0) + (sm.d.dangerRows || 0) }] });
    if (A) { C.summarize(A.records, now, S); sheets.push({ name: 'الوصول', rows: A.records.map(r => exportRow('arrival', r, false)) }); }
    if (D) { C.summarize(D.records, now, S); sheets.push({ name: 'المغادرة', rows: D.records.map(r => exportRow('departure', r, false)) }); }
    try { await saveXlsx(sheets, 'hajj1447-dashboard-' + stamp() + '.xlsx'); toast('تم تصدير Excel (أرقام الجوازات مخفية جزئياً)', 'ok'); } catch (e) { toast(e.message, 'err'); }
  };
  $('#xPdf').onclick = async () => {
    if (!snap) return toast('لا توجد بيانات بعد', 'warn'); toast('جارٍ تجهيز PDF…');
    const { a, d } = snap, rows = [...$$('#nat .nr')].map((el, i) => [i + 1, el.querySelector('.nn span').textContent, el.querySelector('.nn b').textContent]);
    const html = reportHtml({ title: 'التقرير التنفيذي — حجاج 1447هـ', sub: 'ملخص الوصول والمغادرة والجوازات حسب الجنسية', kpis: [['القادمون', a.total], ['تم التسكين', a.done, '#006C35'], ['بانتظار التسكين', a.pending, '#F5A524'], ['المغادرون', d.total, '#0EA5E9'], ['تمت المغادرة', d.done, '#006C35'], ['تنبيهات حرجة', (a.dangerRows || 0) + (d.dangerRows || 0), '#E5484D']], head: ['#', 'الجنسية', 'العدد / النسبة'], rows });
    try { await savePDF(html, 'hajj1447-dashboard-' + stamp() + '.pdf', false); toast('تم إنشاء PDF', 'ok'); } catch (e) { toast('تعذّر إنشاء PDF: ' + e.message, 'err'); }
  };
  onData(() => { if (window.__themeChanged) { Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); window.__themeChanged = false; } render(); });
  render();
}

/* ---------------- الإقلاع ---------------- */
let timer = null;
function startAuto() {
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) refresh(); }, Math.max(10, S.refreshSec) * 1000);
}
function boot() {
  let th = 'dark'; try { th = localStorage.getItem(LS_THEME) || 'dark'; } catch (e) { }
  document.documentElement.dataset.theme = th;
  const page = document.body.dataset.page;
  kindsInUse = page === 'index' ? ['arrival', 'departure'] : [page];
  renderNav(page); hydrate(kindsInUse);
  if (page === 'index') initDashboard(); else initTracker(page);
  setInterval(() => tick(), 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastTry > S.refreshSec * 1000) refresh(); });
  refresh(); startAuto(); updateBadges();
}
document.addEventListener('DOMContentLoaded', boot);
})();
