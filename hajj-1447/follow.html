<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182D">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="حجاج 1447"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>المتابعة والتنبيهات — حجاج 1447هـ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --navy:#07182D;--navy2:#0B2342;--navy3:#12335E;
  --gold:#C5A059;--gold2:#E3C98A;--green:#006C35;--ok:#34C47A;--sky:#0EA5E9;--red:#E5484D;--amber:#F5A524;
  --bg:#07182D;--bg2:radial-gradient(1200px 600px at 85% -10%,rgba(14,165,233,.16),transparent 60%),radial-gradient(900px 500px at 5% 0%,rgba(197,160,89,.13),transparent 55%),linear-gradient(180deg,#07182D,#061325);
  --ink:#EAF1FA;--mut:#93A6BF;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);
  --line:rgba(197,160,89,.22);--line2:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;--nav-h:64px;
}
[data-theme=light]{
  --bg:#F4F1EA;--bg2:linear-gradient(180deg,#F7F4EE,#EDE8DC);--ink:#0B1B30;--mut:#5A6B82;
  --card:#FFFFFF;--card2:#F3EFE5;--line:rgba(7,24,45,.14);--line2:rgba(7,24,45,.08);--shadow:0 8px 24px rgba(7,24,45,.10);
  --ok:#0B8A4B;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100vh;background:var(--bg);background-image:var(--bg2);background-attachment:fixed;color:var(--ink);
  font-family:'Tajawal','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
[hidden]{display:none!important}

/* ---------- Navigation ---------- */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:0 22px;height:var(--nav-h);
  background:linear-gradient(180deg,rgba(7,24,45,.96),rgba(7,24,45,.86));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme=light] .nav{background:rgba(255,255,255,.9)}
.brand{display:flex;align-items:center;gap:11px;min-width:190px}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#8E6E32);color:#07182D;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.brand b{display:block;font-size:15.5px;letter-spacing:.2px}
.brand small{display:block;color:var(--gold);font-size:11.5px;margin-top:-2px}
.tabs{display:flex;gap:6px;margin-inline:auto;padding:5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:8px 13px;white-space:nowrap;border-radius:999px;color:var(--mut);font-weight:600;transition:.25s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.tab svg{width:18px;height:18px;flex:none}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--navy3),#0C4A7A);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(197,160,89,.4);animation:glow 2.4s ease-in-out infinite}
[data-theme=light] .tab.active{color:#fff}
.tab.active::after{content:"";position:absolute;top:6px;inset-inline-start:7px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(197,160,89,.7);animation:ping 1.8s infinite}
.tab.active svg{margin-inline-start:6px}
.tab .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--gold),0 0 8px rgba(197,160,89,.25)}50%{box-shadow:0 0 0 1px var(--gold2),0 0 22px rgba(14,165,233,.55)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(197,160,89,.7)}80%,100%{box-shadow:0 0 0 9px rgba(197,160,89,0)}}
.tools{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:flex-end}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding:0 6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,196,122,.6);animation:ping2 2s infinite}
.live.err i{background:var(--red);animation:none}
.live.load i{background:var(--sky)}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(52,196,122,.55)}80%,100%{box-shadow:0 0 0 8px rgba(52,196,122,0)}}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--card);border:1px solid var(--line2);cursor:pointer;transition:.2s}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}
.ibtn svg{width:18px;height:18px}
.ibtn.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(-360deg)}}

/* ---------- Layout ---------- */
main{max-width:1500px;margin:0 auto;padding:22px 22px 60px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;position:relative}
.hero h1{margin:0;font-size:28px;letter-spacing:.2px}
.hero h1 span{color:var(--gold)}
.hero p{margin:4px 0 0;color:var(--mut)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(135deg,var(--gold),#A98440);color:#07182D;border-color:transparent}
.btn.green{background:var(--green);border-color:transparent;color:#fff}
.btn.sky{background:rgba(14,165,233,.16);border-color:rgba(14,165,233,.5);color:var(--sky)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.panel h2{margin:0 0 12px;font-size:16.5px;display:flex;align-items:center;gap:9px}
.panel h2::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--gold)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.grid2.even{grid-template-columns:1fr 1fr}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2,.grid2.even,.cols2{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{position:relative;padding:15px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line2);overflow:hidden;cursor:default;box-shadow:var(--shadow)}
.kpi::after{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--gold));opacity:.13}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent,var(--gold))}
.kpi .l{color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:32px;font-weight:800;line-height:1.15;margin-top:4px;color:var(--accent,var(--ink));font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px;min-height:18px}
.rgc{margin:6px 0 0;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;border:1px solid var(--line)}
.rgc.ok{background:rgba(52,196,122,.14);border-color:#34C47A;color:#86efac}
.rgc.pend{background:rgba(14,165,233,.12);border-color:#0EA5E9;color:#7dd3fc}
.rgc.na{background:rgba(139,92,246,.16);border-color:#8b5cf6;color:#c4b5fd}
[data-theme=light] .rgc.ok{color:#116b3c}[data-theme=light] .rgc.pend{color:#0369a1}[data-theme=light] .rgc.na{color:#6d28d9}
.prep.na{border-color:#8b5cf6;color:#c4b5fd;background:rgba(139,92,246,.12)}[data-theme=light] .prep.na{color:#6d28d9}
.kpi.na{--accent:#8b5cf6}
.kpi.gold{--accent:var(--gold)}.kpi.ok{--accent:var(--ok)}.kpi.sky{--accent:var(--sky)}.kpi.red{--accent:var(--red)}.kpi.amber{--accent:var(--amber)}
.kpi.red.pulse{animation:redpulse 2s infinite}
@keyframes redpulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 1px var(--red),0 0 22px rgba(229,72,77,.35)}}
.bar{height:6px;border-radius:9px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--ok));border-radius:9px;transition:width .6s}

/* ---------- Alert bar ---------- */
.alertbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;margin-bottom:16px;background:linear-gradient(90deg,rgba(229,72,77,.18),rgba(229,72,77,.06));border:1px solid rgba(229,72,77,.5);cursor:pointer}
.alertbar b{color:#ff8f93}
[data-theme=light] .alertbar b{color:#b3262b}
.alertbar .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:ping3 1.4s infinite}
@keyframes ping3{0%{box-shadow:0 0 0 0 rgba(229,72,77,.7)}80%,100%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
.stale{background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.5);padding:9px 14px;border-radius:12px;margin-bottom:14px;font-size:13.5px}

/* ---------- Flight rail ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.fl{scroll-snap-align:start;flex:0 0 232px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);cursor:pointer;transition:.2s;position:relative}
.fl:hover{border-color:var(--gold)}
.secs{margin:14px 0}
.sectiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stile{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t n" "s s";align-items:center;gap:2px 8px;text-align:right;padding:9px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);color:inherit;font:inherit;cursor:pointer;transition:.2s;position:relative}
.stile:hover,.stile.on{border-color:var(--gold)}
.stile.on{box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(197,160,89,.22)}
.stile .st{grid-area:t;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.stile .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.stile.now .st::before{background:var(--sky,#0EA5E9);animation:pulseDot 1.6s infinite}
.stile.done .st::before{background:var(--green,#2fbf71)}
.stile .sn{grid-area:n;font-size:22px;font-weight:800;line-height:1}
.stile .ss{grid-area:s;font-size:11.5px;opacity:.8;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.stile .ss .cd{font-size:11.5px}
.secpanel{margin-top:10px;padding:12px 14px 6px}
@media(max-width:640px){.stile{padding:8px 9px}.stile .st{font-size:11.5px}.stile .sn{font-size:19px}.stile .ss{font-size:10.5px}}
.fl.full{opacity:.78}.fl .okmark{font-size:12px;font-weight:700;color:var(--green,#2fbf71)}
.sec{margin:10px 0 4px}.sec+.sec{border-top:1px dashed var(--line2);padding-top:12px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 6px}
.sec-h b{font-size:15px;display:inline-flex;align-items:center;gap:7px}
.sec-h b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold)}
.sec.now .sec-h b::before{background:var(--sky,#0EA5E9);box-shadow:0 0 0 0 rgba(14,165,233,.6);animation:pulseDot 1.6s infinite}
.sec.done .sec-h b::before{background:var(--green,#2fbf71)}
.sec-h .cnt{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line2)}
.sec-h .cnt:empty{display:none}
@keyframes pulseDot{70%{box-shadow:0 0 0 8px rgba(14,165,233,0)}100%{box-shadow:0 0 0 0 rgba(14,165,233,0)}}
.fl.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(197,160,89,.25)}
.fl .t{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.fl .t .no{font-size:17px;letter-spacing:.5px;color:var(--gold2)}
[data-theme=light] .fl .t .no{color:#8A6A2A}
.fl .m{color:var(--mut);font-size:12.5px;margin:2px 0 8px;display:flex;justify-content:space-between;gap:6px}
.fl .cd{font-size:18px;font-weight:700;margin:6px 0}
.fl .row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:5px;color:var(--mut)}
.fl.danger{border-color:rgba(229,72,77,.55)}
.fl.warn{border-color:rgba(245,165,36,.5)}
.cd{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cd.neg{color:var(--mut)}
.cd.crit{color:var(--red);font-weight:800}
.cd.warn{color:var(--amber);font-weight:700}

/* ---------- Toolbar & table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.field{position:relative}
.toolbar input[type=search],.toolbar select,.set input,.set select{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-width:140px;outline:none}
.toolbar input[type=search]{min-width:240px;padding-inline-start:36px}
.field svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut);pointer-events:none}
.toolbar input:focus,.toolbar select:focus,.set input:focus,.set select:focus{border-color:var(--gold)}
select option{background:#0B2342;color:#EAF1FA}
[data-theme=light] select option{background:#fff;color:#0B1B30}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mut);user-select:none}
.sw input{accent-color:var(--gold);width:16px;height:16px}
.sp{flex:1}
.bulk{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:rgba(197,160,89,.14);border:1px solid var(--line);margin-bottom:10px}
.tablewrap{overflow:auto;border-radius:12px;border:1px solid var(--line2);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
thead th{position:sticky;top:0;z-index:2;background:#0C2646;color:var(--gold2);text-align:start;padding:11px 12px;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line)}
[data-theme=light] thead th{background:#E8E1D0;color:#5A4520}
thead th.sort{cursor:pointer}thead th.sort:hover{color:#fff}
[data-theme=light] thead th.sort:hover{color:#000}
thead th .ar{opacity:.6;margin-inline-start:4px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr.r:hover td{background:rgba(255,255,255,.04)}
tbody tr.r.done td{opacity:.72}
tbody tr.r.danger td:first-child{box-shadow:inset -3px 0 0 var(--red)}
tbody tr.r.warn td:first-child{box-shadow:inset -3px 0 0 var(--amber)}
tbody tr.r.syncing td{background:rgba(14,165,233,.08)}
.nm{font-weight:700;cursor:pointer}
.sub{color:var(--mut);font-size:12.5px}
.nat{display:flex;align-items:center;gap:8px;white-space:nowrap}
.flag{width:26px;height:18px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18);background:var(--card2);flex:none}
.flag.ph{display:inline-grid;place-items:center;font-size:10px;color:var(--mut)}
.pp{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(0,108,53,.22)}
.chip.info{color:var(--sky);background:rgba(14,165,233,.14)}
.chip.warn{color:var(--amber);background:rgba(245,165,36,.14)}
.chip.danger{color:#ff7b80;background:rgba(229,72,77,.16)}
[data-theme=light] .chip.danger{color:#B3262B}
.chip.mut{color:var(--mut);background:var(--line2)}
.chip.sync{color:var(--sky);background:rgba(14,165,233,.14)}
tr.detail td{background:rgba(255,255,255,.03)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px}
.kv div{font-size:13px}.kv b{color:var(--gold2);display:block;font-weight:600;font-size:12px}
.more{text-align:center;padding:12px}
.empty{padding:40px;text-align:center;color:var(--mut)}

/* ---------- Dashboard bits ---------- */
.chartbox{position:relative;height:270px}
.nxt{display:flex;flex-direction:column;gap:8px}
.nx{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line2)}
.nx .no{font-weight:800;color:var(--gold2);min-width:66px}
[data-theme=light] .nx .no{color:#8A6A2A}
.nx .i{flex:1;min-width:0}.nx .i small{display:block;color:var(--mut)}
.nx .c{font-weight:700}
.nx h3,.cols2 h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.rings{display:flex;gap:22px;justify-content:space-around;flex-wrap:wrap;padding:6px 0}
.ring{text-align:center}
.ring svg{width:140px;height:140px;transform:rotate(90deg) scaleX(-1)}
.ring .tx{margin-top:-96px;height:96px;display:grid;place-content:center;font-size:26px;font-weight:800}
.ring .tx small{font-size:12px;color:var(--mut);font-weight:500}
.ring .lb{margin-top:6px;color:var(--mut);font-size:13.5px}
.natl{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto;padding-inline-end:4px}
.nr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.nr .nn{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px}
.nr .bar{height:5px}
.nr .bar>i{background:linear-gradient(90deg,var(--sky),var(--gold))}
.feed .nx{border-inline-start:3px solid var(--red)}

/* ---------- Modal / toast ---------- */
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.prep{margin:8px 0 0;padding:6px 10px;border-radius:10px;font-size:12.5px;border:1px solid var(--line);background:rgba(245,165,36,.10)}
.prep.l1{border-color:#f5a524;color:#fcd34d}
.prep.l2{border-color:#f97316;background:rgba(249,115,22,.14);color:#fdba74;font-weight:700}
.prep.l3{border-color:#ef4444;background:rgba(239,68,68,.18);color:#fca5a5;font-weight:800;animation:pz 1.6s infinite}
.prep.ok{border-color:#34C47A;color:#86efac;background:rgba(52,196,122,.10)}
@keyframes pz{50%{opacity:.6}}
.rdy-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.rdy-h dt{font-size:11.5px;color:var(--mut)}.rdy-h dd{margin:2px 0 0;font-weight:700}
.rdy-pt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}.rdy-pt b{margin-inline-end:auto}
.rdy-tw{max-height:34vh;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:12px}
.rdy-t{width:100%;min-width:0!important;table-layout:auto;border-collapse:collapse;font-size:12.5px}

function findHeaderRow(rows) {

function buildMapping(headers, kind, overrides, checkHeader) {
  const H = headers.map(normAr);
  const map = {}; const used = new Set();
  // عمود التأكيد (Check / Check_De): مطابقة تامة بعد التطبيع
  const ck = normAr(checkHeader);

  if (overrides && overrides.check) { const j = headers.indexOf(overrides.check); if (j >= 0) ci = j; }
  if (ci >= 0) { map.check = ci; used.add(ci); }
  // الربط اليدوي أولاً
  Object.keys(overrides || {}).forEach(f => {
    if (f === 'check' || !FIELDS[f]) return;
    const j = headers.indexOf(overrides[f]);
    if (j >= 0 && !used.has(j)) { map[f] = j; used.add(j); }
  });
  const cand = [];
  Object.keys(FIELDS).forEach(f => {
    if (map[f] != null) return;
    H.forEach((h, i) => {
      if (used.has(i) || !h || h.startsWith('check')) return;
      let sc = 0;
      FIELDS[f].nal.forEach(a => {
        if (h === a) sc = Math.max(sc, 100);
        else if (a.length >= 4 && h.includes(a)) sc = Math.max(sc, 40 + a.length);
      });
      if (!sc) return;
      if (f !== 'airCity' && f !== 'stayCity' && (h.includes('مدينه') || h.includes('city'))) sc -= 80;
      if (f === 'stayCity' && /hotel|فندق/.test(h) && !/city|مدينه/.test(h)) sc -= 150;           // «Destination_Hotel» اسم فندق لا مدينة
      if (f === 'stayCity' && /وجهه|destination/.test(h)) sc += kind === 'arrival' ? 30 : -200;   // في المغادرة «الوجهة» وجهة الرحلة لا مدينة الفندق
      if (f === 'date' || f === 'time' || f === 'airport' || f === 'airCity') {
        const arr = /arriv|وصول/.test(h), dep = /depart|مغادر/.test(h);
        if (kind === 'arrival') { if (arr) sc += 30; if (dep) sc -= 60; }
        else { if (dep) sc += 30; if (arr) sc -= 60; }
      }
      if (sc > 0) cand.push({ f, i, sc });
    });
  });
  cand.sort((a, b) => b.sc - a.sc || a.i - b.i);
  cand.forEach(c => { if (map[c.f] == null && !used.has(c.i)) { map[c.f] = c.i; used.add(c.i); } });
  return map;
}

/* =====================================================================
   التنقلات الداخلية — تبويب Transfers
   صف لكل حاج وفيه إقامات متتالية (فندق/مدينة/دخول/خروج). كل انتقال بين إقامتين متتاليتين
   يُجمَّع مع من يشاركه اليوم والمنطلق والوجهة:
     • مدينتان مختلفتان  → قطار، وحافلتان تحتاجان اعتماداً: الفندق ← المحطة، والمحطة ← الفندق
     • داخل المدينة مع كدانة/المشاعر → حافلات
     • داخل المدينة فندق ← فندق → حافلات
   أقل من 8 أفراد بلا حافلة (سيارة)، وأقصى 49 فرداً في الحافلة.
   ===================================================================== */
const TR = { BUS_MAX: 49, STATION: { makkah: 'محطة قطار مكة', madinah: 'محطة قطار المدينة', jeddah: 'محطة قطار جدة' } };
const TR_TYPES = {
  train: { ar: 'قطار بين المدن', ic: '🚆', cls: 'train', o: 0 },
  mashaer: { ar: 'فندق ↔ كدانة', ic: '🕋', cls: 'car', o: 1 },
  hotel: { ar: 'فندق ← فندق', ic: '🏨', cls: 'bus', o: 2 }
};
const CITYTOK = /^(makk?ah|mecca|مكة|مكه|مكة المكرمة|madin[ae]h?|medina|المدينة|المدينة المنورة|jedd?ah|jidda|جدة|جده)$/i;
const isCityTok = v => CITYTOK.test(String(v == null ? '' : v).trim());
const isMashaer = t => /كدان|kudai|kidana|kudana|مشاعر|mashaer|عرفات|arafa|مزدلفة|muzdalif|(^|\s)منى(\s|$)|(^|\s)mina(\s|$)/i.test(String(t || ''));
const trP2 = n => String(n).padStart(2, '0');
const trDateKey = v => { const p = C.parseDateParts(v, S.dateOrder); return p ? p.y + '-' + trP2(p.mo) + '-' + trP2(p.d) : ''; };
const trDate = k => new Date(k + 'T12:00:00+03:00');
const trDayTxt = k => { const d = trDate(k); if (isNaN(d)) return k; const w = new Intl.DateTimeFormat('ar-SA-u-nu-latn-ca-gregory', { timeZone: C.TZ_NAME, weekday: 'long' }).format(d); return w + ' \u2066' + k.slice(8, 10) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4) + '\u2069'; };
const trMinBus = () => Math.max(8, +(S.transport && S.transport.busMin) || 0);

// يحلّل تبويب Transfers: الأعمدة تُكتشف من العناوين، والفندق/المدينة من محتوى الخلية (عناوين الإقامتين الثانية والأخيرة قد تكون معكوسة)
function processTransfers(rows) {
  const res = { kind: 'transfers', records: [], moves: [], warn: '', stats: { rows: 0, noStay: 0, nocity: 0 } };
  const hi = C.findHeaderRow(rows);
  if (hi < 0) { res.warn = 'تبويب Transfers فارغ'; return res; }
  const raw = rows[hi].map(h => String(h == null ? '' : h).trim());
  const pc = raw.findIndex(h => /جواز|passport/i.test(h));
  const blocks = [];
  raw.forEach((h, j) => {
    if (!/تاريخ\s*الدخول|check\s*-?in/i.test(h)) return;
    let out = -1; for (let k = j + 1; k < raw.length; k++) { if (/تاريخ\s*الخروج|check\s*-?out/i.test(raw[k])) { out = k; break; } if (/تاريخ\s*الدخول/i.test(raw[k])) break; }
    blocks.push({ a: j - 2, b: j - 1, inn: j, out });
  });
  if (pc < 0 || !blocks.length) { res.warn = 'لم أجد أعمدة الجواز أو الإقامات (تاريخ الدخول/الخروج) في تبويب Transfers — الأعمدة الموجودة: ' + raw.filter(Boolean).join(' | '); return res; }
  const cell = (row, j) => (j >= 0 && row[j] != null) ? String(row[j]).trim() : '';
  const stayOf = (row, b) => {
    const x = cell(row, b.a), y = cell(row, b.b);
    let hotel = x, city = y;
    if (isCityTok(x) && !isCityTok(y)) { hotel = y; city = x; }
    const inn = trDateKey(cell(row, b.inn)), out = b.out >= 0 ? trDateKey(cell(row, b.out)) : '';
    if (!hotel && !city && !inn) return null;
    return { hotel, cityRaw: city, city: C.cityOf(city), inn, out };
  };
  const map = new Map();
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i]; const passport = cell(row, pc);
    if (!passport) continue;
    const stays = blocks.map(b => stayOf(row, b)).filter(Boolean);
    const rec = { row: i + 1, passport, name: '', stays };
    res.records.push(rec); res.stats.rows++;
    if (stays.length < 2) { res.stats.noStay++; continue; }
    for (let k = 0; k < stays.length - 1; k++) {
      const a = stays[k], b = stays[k + 1], date = a.out || b.inn;
      if (!date || !a.hotel || !b.hotel) continue;
      if (a.hotel === b.hotel && a.city === b.city) continue;                       // لا تنقّل: الإقامة نفسها
      const inter = !!(a.city && b.city && a.city !== b.city);
      if (!a.city || !b.city) res.stats.nocity++;
      const type = inter ? 'train' : ((isMashaer(a.hotel) || isMashaer(b.hotel)) ? 'mashaer' : 'hotel');
      const key = [date, a.city || a.cityRaw, a.hotel, b.city || b.cityRaw, b.hotel].join('|');
      let m = map.get(key);
      if (!m) { m = { key, date, type, from: { hotel: a.hotel, city: a.city, cityRaw: a.cityRaw }, to: { hotel: b.hotel, city: b.city, cityRaw: b.cityRaw }, pilgrims: [], pax: 0 }; map.set(key, m); }
      m.pilgrims.push(rec); m.pax++;
    }
  }
  res.moves = [...map.values()].sort((p, q) => p.date < q.date ? -1 : p.date > q.date ? 1 : (TR_TYPES[p.type].o - TR_TYPES[q.type].o) || (p.from.hotel < q.from.hotel ? -1 : 1));
  res.moves.forEach((m, i) => { m.id = i; });
  if (res.stats.nocity) res.warn = res.stats.nocity + ' انتقال بلا مدينة معروفة (تُعامل كتنقل داخل المدينة)';
  applyNames(res.records);
  return res;
}

// يوزّع الركاب على حافلات ≤ 49؛ وإن بقيت آخر حافلة بأقل من الحد الأدنى تُكمَّل من التي قبلها
function splitTrBuses(list, minBus) {
  const n = list.length, out = []; if (!n) return out;
  const nb = Math.ceil(n / TR.BUS_MAX), sizes = new Array(nb).fill(TR.BUS_MAX), rem = n - TR.BUS_MAX * (nb - 1);
  sizes[nb - 1] = rem;
  if (nb > 1 && rem < minBus) { sizes[nb - 1] = minBus; sizes[nb - 2] -= (minBus - rem); }
  let p = 0; sizes.forEach(s => { out.push(list.slice(p, p + s)); p += s; });
  return out;
}
// مراحل الانتقال: بين المدن = حافلة فندق←محطة (اعتماد) + قطار + حافلة محطة←فندق (اعتماد)
function trLegs(m) {
  const bus = m.pax >= trMinBus();
  if (m.type === 'train') {
    const sa = TR.STATION[m.from.city] || 'محطة القطار', sb = TR.STATION[m.to.city] || 'محطة القطار';
    return [
      { id: 'a', kind: bus ? 'bus' : 'car', from: m.from.hotel, to: sa, apr: bus },
      { id: 't', kind: 'train', from: sa, to: sb, apr: false },
      { id: 'b', kind: bus ? 'bus' : 'car', from: sb, to: m.to.hotel, apr: bus }];
  }
  return [{ id: 'm', kind: bus ? 'bus' : 'car', from: m.from.hotel, to: m.to.hotel, apr: false }];
}
const trBuses = (m, leg) => leg.kind === 'bus' ? splitTrBuses(m.pilgrims, trMinBus()) : [m.pilgrims];
const trKey = (m, leg, i) => ('TR|' + m.date + '|' + leg.id + '|' + m.from.hotel + '>' + m.to.hotel + '|' + (i + 1)).slice(0, 200);
const trOk = k => { const e = state.appr[k]; return !!(e && e.status === 'approved'); };
const trOpenAppr = m => trLegs(m).some(l => l.apr && trBuses(m, l).some((b, i) => !trOk(trKey(m, l, i))));

function processRows(kind, rows) {
  if (kind === 'transfers') { const tr = processTransfers(rows); state.data.transfers = tr; return tr; }
  const res = C.toRecords(rows, kind, S), pend = state.pending[kind];
  res.records.forEach(r => {
    const p = pend[pkey(r)]; if (!p) return;
    if (r.done === p.value || Date.now() - p.ts > 600000) delete pend[pkey(r)];
    else { r.done = p.value; r.syncing = true; }
  });
  // حماية من اسم صفحة خاطئ: غياب عمود التأكيد المتوقع يعني غالباً أن الصفحة ليست المقصودة
  res.warn = (res.records.length && res.map.check == null) ? 'لم يُعثر على عمود «' + S[kind].checkHeader + '» في صفحة «' + tabOf(kind) + '» — تأكد من اسم الصفحة في الإعدادات' : '';

/* ---------------- الكتابة (Apps Script) ---------------- */
async function writeChecks(kind, recs, value, isUndo) {
  if (!CONN.webapp) { toast('لم يُضبط رابط الخادم', 'warn'); return false; }
  const d = state.data[kind];
  if (d.map.check == null) { toast('لم يُعثر على عمود ' + S[kind].checkHeader + ' في الجدول', 'err'); return false; }
  const auth = await ensureAuth(); if (!auth) return false;
  recs.forEach(r => { r.done = value; r.syncing = true; state.pending[kind][pkey(r)] = { value, ts: Date.now() }; });
  emit();
  const revert = rs => rs.forEach(r => { delete state.pending[kind][pkey(r)]; r.done = !value; r.syncing = false; });
  let doneN = 0;
  try {
    // الكتابة عبر GET على دفعات صغيرة (تعمل مع أي نشر لـ Apps Script وتتجنب مشاكل POST وإعادة التوجيه)
    const CH = 10, results = [];
    for (let i = 0; i < recs.length; i += CH) {
      const part = recs.slice(i, i + CH);
      const payload = { kind, sheet: tabOf(kind), headerRow: d.headerRow, ops: part.map(r => ({ row: r.row, key: r.key, keyHeader: r.keyHeader, value })), by: auth.by, pin: auth.pin, ctx: ctxOf(part) };
      const j = await api('write', {}, payload);
      if (!j.ok) {
        if (j.error === 'bad_pin') { ssSet(SS_PIN, ''); updateRole(); }
        throw new Error({ not_configured: 'المنظومة لم تُهيّأ بعد', bad_pin: 'رمز المشرف غير صحيح', locked: 'محاولات كثيرة — انتظر 15 دقيقة', readonly: 'الموقع بوضع العرض فقط' }[j.error] || j.error || 'فشل الحفظ');
      }
      if (!Array.isArray(j.results)) throw new Error('الكود المنشور قديم: ألصق أحدث Code.gs ثم نشر ← إدارة عمليات النشر ← ✏ ← إصدار جديد');
      results.push(...j.results); doneN = i + part.length;
    }
    const j = { results };
    const bad = [];
    (j.results || []).forEach((x, i) => { if (!x.ok) bad.push([recs[i], x.error]); });
    revert(bad.map(b => b[0]));
    if (bad.length) toast('تعذّر حفظ ' + bad.length + ' سجل: ' + bad[0][1], 'err');
    const okN = recs.length - bad.length;
    if (okN) {
      const okRecs = recs.filter(r => !bad.some(b => b[0] === r));
      toast((value ? 'تم حفظ ' : 'تم التراجع عن ') + okN + ' سجل', 'ok', isUndo ? null : { label: 'تراجع', fn: () => writeChecks(kind, okRecs, !value, true) });
    }
    emit();
    setTimeout(() => refresh([kind]), 2500); setTimeout(() => refresh([kind]), 9000);
    return true;
  } catch (e) {
    revert(recs.slice(doneN)); emit(); toast('فشل الحفظ: ' + (e.message || e), 'err'); return false;
  }
}

const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

// رابط الزوار: #w=<رابط الخادم>. لا يحمل أي سر، لكنه يغيّر الخادم الذي يتصل به المتصفح، فيُطلب التأكيد إن كان مختلفاً عن المحفوظ.
async function handleHash() {
  const m = /^#w=([A-Za-z0-9_-]+)$/.exec(location.hash); if (!m) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  let url; try { url = b64d(m[1]); } catch (e) { url = ''; }
  if (!WEB_RE.test(url)) { toast('رابط الدعوة غير صالح', 'err'); return; }
  if (url === CONN.webapp) return;
  if (CONN.webapp && !(await confirmBox('تغيير خادم المنظومة', 'هذا الرابط سيوجّه هذا المتصفح إلى خادم آخر (…' + url.split('/s/')[1].slice(-8) + ') بدل الحالي (' + serverTail() + '). تابع فقط إن كان من جهة تثق بها، ولا تُدخل كلمة مرور المالك إن لم تكن متأكداً.', 'تغيير الخادم'))) return;
  CONN.webapp = url; CONN.session = ''; clearCaches(); saveConn();
}

async function saveXlsx(sheets, filename) {
  await loadLib(LIBS.xlsx);
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const rows = s.rows.length ? s.rows : [{ '—': 'لا توجد بيانات' }];
    const ws = XLSX.utils.json_to_sheet(rows);
    const keys = Object.keys(rows[0]);
    ws['!cols'] = keys.map(k => ({ wch: Math.min(42, Math.max(k.length + 2, ...rows.slice(0, 300).map(r => String(r[k] == null ? '' : r[k]).length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31));
  });
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.writeFile(wb, filename);
}

const IS_MOBILE = /iP(hone|ad|od)|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// الجوال (آيفون خصوصاً) يمنع التنزيل التلقائي بعد عملية طويلة؛ فنعرض زراً يضغطه المستخدم للمشاركة/الحفظ/الفتح
function pdfDeliver(blob, filename) {
  const url = URL.createObjectURL(blob);
  if (!IS_MOBILE) { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 6000); return; }
  const file = new File([blob], filename, { type: 'application/pdf' });
  const ov = modal('<h3>📄 ملف PDF جاهز</h3><p class="sub" dir="ltr">' + esc(filename) + ' · ' + Math.max(1, Math.round(blob.size / 1024)) + ' KB</p><p class="hint">اضغط «مشاركة / حفظ» ثم اختر «حفظ في الملفات» أو أرسله لتطبيق آخر.</p><div class="act"><button class="btn green" id="pdS">📤 مشاركة / حفظ</button><a class="btn sky" id="pdO" href="' + url + '" target="_blank" rel="noopener">👁 فتح</a><button class="btn" id="pdX">إغلاق</button></div>');
  $('#pdS', ov).onclick = async () => {
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: filename }); else window.open(url, '_blank'); }
    catch (e) { if (e && e.name !== 'AbortError') { window.open(url, '_blank'); } }
  };
  $('#pdX', ov).onclick = () => ov.close();
}
async function savePDF(html, filename, landscape) {
  await loadLib(LIBS.pdf);
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + (landscape ? 1100 : 760) + 'px;background:#fff';
  host.innerHTML = html; document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    // حدّ الكانفاس في آيفون ≈ 16 مليون بكسل: نخفّض الدقة تلقائياً للتقارير الطويلة
    const area = host.offsetWidth * Math.max(1, host.scrollHeight), scale = Math.max(.7, Math.min(2, Math.sqrt((IS_MOBILE ? 9e6 : 30e6) / area)));
    const blob = await html2pdf().set({ margin: [8, 8, 10, 8], filename, image: { type: 'jpeg', quality: .92 }, html2canvas: { scale, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: landscape ? 'landscape' : 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: ['tr'] } }).from(host).outputPdf('blob');
    pdfDeliver(blob, filename);
  } finally { host.remove(); }
}

  /* ---- نافذة الاعتماد: كل مرحلة وحافلاتها (≤49) بجوازاتها وجنسياتها للنسخ وتسجيل الاعتماد ---- */
  function openLegs(m, legs, mode) {
    const masked = isMasked();
    const sub = esc(m.from.hotel) + ' ← ' + esc(m.to.hotel) + ' · ' + esc(trDayTxt(m.date)) + ' · ' + m.pax + ' حاج';
    const ov = modal('<h3>' + (mode === 'pp' ? '🛂 جوازات الركاب' : '🧾 اعتماد الحافلات') + '</h3><p class="sub">' + sub + '</p>' +
      (mode === 'appr' ? '<p class="hint">يصدر الاعتماد لكل حافلة (حتى ' + TR.BUS_MAX + ' فرداً): انسخ الجوازات والجنسيات وأدخلها في نسك مسار، ثم اضغط «تم إصدار الاعتماد».</p>' : '') +
      (masked ? '<p class="hint" style="color:var(--amber,#f5a524)">⚠ أرقام الجوازات مخفية في وضع الزائر — سجّل دخول المالك لعرضها ونسخها كاملة.</p>' : '') +
      '<div id="trBody"></div><div class="act">' + (masked ? '' : '<button class="btn sky" data-tb="*:all:X">📊 Excel — كل القائمة</button><button class="btn" data-tb="*:all:D">📄 PDF — كل القائمة</button>') + '<button class="btn" id="trX">إغلاق</button></div>');
    ov.classList.add('wide');
    const legOf = id => legs.find(l => l.id === id);
    const nm = (id, i) => { const l = legOf(id); return l ? trBuses(m, l)[i] || [] : m.pilgrims; };
    const card = (l, b, i, n) => {
      const k = trKey(m, l, i), ok = l.apr && trOk(k), e = state.appr[k];
      const head = l.kind === 'bus' ? '🚌 حافلة ' + (i + 1) + (n > 1 ? ' من ' + n : '') : (l.all ? '🛂 كل الركاب' : l.kind === 'train' ? '🚆 ركاب القطار' : '🚗 ركاب السيارات');
      return '<div class="ap ' + (l.kind === 'train' ? 'train' : 'bus') + '"><div class="ap-h"><b>' + head + '</b>' + (ok ? '<span class="rgc ok">✓ اعتماد مسجّل' + (e && e.by ? ' — ' + esc(e.by) : '') + '</span>' : '') + '<b class="num">' + b.length + (l.kind === 'bus' ? ' / ' + TR.BUS_MAX : '') + ' فرد</b></div>' +
        '<div class="ap-a" style="flex-wrap:wrap">' + (masked ? '' : '<button class="btn sm sky" data-tb="' + l.id + ':' + i + ':X">📊 تصدير Excel</button><button class="btn sm" data-tb="' + l.id + ':' + i + ':D">📄 تصدير PDF</button>') +
        '<button class="btn sm" data-tb="' + l.id + ':' + i + ':T">نسخ ملخص</button>' + (l.apr ? '<button class="btn sm ' + (ok ? '' : 'green') + '" data-trap="' + l.id + ':' + i + '">' + (ok ? 'إلغاء الاعتماد' : '✓ تم إصدار الاعتماد') + '</button>' : '') + '</div>' +
        '<div class="rdy-tw"><table class="rdy-t"><thead><tr><th>#</th><th>الاسم</th><th>رقم الجواز</th><th>الجنسية</th></tr></thead><tbody>' +
        b.map((r, j) => '<tr><td>' + (j + 1) + '</td><td>' + esc(nameOf(r) || '—') + '</td><td class="rdy-pp" dir="ltr"' + (masked ? '' : ' data-tc="' + l.id + ':' + i + ':' + j + '" title="اضغط للنسخ"') + '>' + esc(r.passport || '—') + '</td><td>' + natHtml(r) + '</td></tr>').join('') +
        '</tbody></table></div></div>';
    };
    const draw = () => {
      $('#trBody', ov).innerHTML = legs.map(l => {
        const bs = trBuses(m, l), n = bs.length, ok = l.apr ? bs.filter((b, i) => trOk(trKey(m, l, i))).length : 0;
        return '<div class="trsec"><h4>' + (l.kind === 'bus' ? '🚌' : l.kind === 'train' ? '🚆' : '🚗') + ' ' + esc(l.from) + ' ← ' + esc(l.to) + (l.kind === 'bus' ? ' <span class="hint">' + n + (n === 1 ? ' حافلة' : ' حافلات') + (l.apr ? ' · معتمد ' + ok + '/' + n : '') + '</span>' : '') + '</h4>' + bs.map((b, i) => card(l, b, i, n)).join('') + '</div>';
      }).join('');
    };
    ov.addEventListener('click', async e => {
      const t = e.target.closest('[data-tb],[data-tc],[data-trap]'); if (!t) return;
      if (t.dataset.trap != null) {
        const [lid, si] = t.dataset.trap.split(':'), i = +si, l = legOf(lid), k = trKey(m, l, i), on = !trOk(k);
        try { await trSetAppr(k, l.from + ' ← ' + l.to + ' (' + (i + 1) + ')', on); toast(on ? 'تم تسجيل الاعتماد' : 'أُلغي الاعتماد', 'ok'); draw(); render(); }
        catch (x) { toast('فشل الحفظ: ' + (x.message || x), 'err'); }
        return;
      }
      if (t.dataset.tc != null) { const [lid, i, j] = t.dataset.tc.split(':'); const r = (nm(lid, +i))[+j]; if (r) copyTxt(r.passport, 'نُسخ الجواز'); return; }
      const [lid, w, mode2] = t.dataset.tb.split(':'), l = legOf(lid), list = w === 'all' ? m.pilgrims : nm(lid, +w), rs = list.filter(r => r.passport), from = l ? l.from : m.from.hotel, to = l ? l.to : m.to.hotel;
      if (mode2 === 'X' || mode2 === 'D') {
        const whole = w === 'all' || !!(l && l.all);
        const hd = ['#', 'الاسم', 'رقم الجواز', 'الجنسية', 'من', 'إلى'], rws = list.map((r, j) => [j + 1, nameOf(r), r.passport || '', natTxt(r), from, to]);
        const ttl = (whole ? 'قائمة ركاب التنقل' : 'اعتماد حافلة') + ' — ' + from + ' ← ' + to, meta = ['التاريخ: ' + m.date, 'العدد: ' + list.length + ' فرد'];
        if (mode2 === 'X') { EXP.xlsx((whole ? 'transfer-passengers-' : 'transfer-approval-') + m.date + '-m' + m.id + (whole ? '' : '-' + lid + '-bus' + (+w + 1)), ttl, meta, hd, rws); toast('تم إنشاء ملف Excel', 'ok'); }
        else EXP.pdf(ttl, meta, hd, rws);
      }
      else if (mode2 === 'T') copyTxt('🚌 ' + from + ' ← ' + to + '\nالتاريخ: ' + trDayTxt(m.date) + '\nالعدد: ' + list.length + ' فرد', 'نُسخ الملخص');
    });
    $('#trX', ov).onclick = () => ov.close();
    draw();
  }
  // قائمة الجوازات لكل الحركة (ركاب بلا تقسيم حافلات)
  const openPass = m => openLegs(m, [{ id: 'p', kind: 'car', from: m.from.hotel, to: m.to.hotel, apr: false, all: true }], 'pp');

  /* ---- بطاقات التنقلات: مثل بطاقة الوصول ---- */
  const legChip = (m, l) => {
    const n = trBuses(m, l).length;
    return l.kind === 'train' ? '<span class="tp train">🚆 قطار</span>' : l.kind === 'bus' ? '<span class="tp bus">🚌 ' + n + (n === 1 ? ' حافلة' : ' حافلات') + '</span>' : '<span class="tp car">🚗 سيارة</span>';
  };
  const trBusRows = m => {
    const bl = trLegs(m).filter(l => l.kind === 'bus'); if (!bl.length) return '';
    if (bl.length === 2) { // مرحلتا الحافلة (فندق←محطة ومحطة←فندق) بنفس التوزيع: صف واحد
      const b0 = trBuses(m, bl[0]), b1 = trBuses(m, bl[1]);
      if (b0.length === b1.length && b0.every((b, i) => b.length === b1[i].length)) return '<div><dt>أفراد الحافلات (ذهاباً للمحطة وإياباً منها)</dt><dd><b>' + b0.length + (b0.length === 1 ? ' حافلة' : ' حافلات') + ' · ' + m.pax + ' فرد لكل مرحلة</b><div class="bnums">' + b0.map((b, i) => '<span class="bn' + (bl.every(l => !l.apr || trOk(trKey(m, l, i))) && bl.some(l => l.apr) ? ' ok' : '') + '" title="حافلة ' + (i + 1) + '">' + (i + 1) + ': ' + b.length + '</span>').join('') + '</div></dd></div>';
    }
    return bl.map(l => { const bs = trBuses(m, l); return '<div><dt>أفراد الحافلات — ' + esc(l.from) + ' ← ' + esc(l.to) + '</dt><dd><b>' + bs.length + (bs.length === 1 ? ' حافلة' : ' حافلات') + ' · ' + m.pax + ' فرد</b><div class="bnums">' + bs.map((b, i) => '<span class="bn' + (l.apr && trOk(trKey(m, l, i)) ? ' ok' : '') + '" title="حافلة ' + (i + 1) + '">' + (i + 1) + ': ' + b.length + '</span>').join('') + '</div></dd></div>'; }).join('');
  };
  const cardHtml = m => {
    const T = TR_TYPES[m.type], st = aprStat(m), legs = trLegs(m), hasApr = st.tot > 0, full = hasApr && st.ok === st.tot;
    const chip = !hasApr ? '<span class="chip info">' + T.ic + ' ' + T.ar + '</span>' : (full ? '<span class="chip ok">✓ اعتماد مكتمل</span>' : '<span class="chip warn">بانتظار الاعتماد ' + st.ok + '/' + st.tot + '</span>');
    const nobus = legs.some(l => l.kind === 'car');
    const badge = !hasApr ? (m.type === 'train' ? '<div class="rgc na">🚗 أقل من ' + trMinBus() + ' أفراد — بسيارات، لا اعتماد حافلات</div>' : '') : '<div class="rgc ' + (full ? 'ok' : 'pend') + '">' + (full ? '🧾 اعتماد الحافلات مسجّل في نسك مسار (' + st.ok + ' حافلة)' : '✗ اعتماد الحافلات غير مكتمل — ' + st.ok + ' من ' + st.tot) + '</div>';
    return '<article class="gcard trcard ' + m.type + (full ? ' done' : '') + (hasApr && !full ? ' warn' : '') + '" data-mv="' + m.id + '">' +
      '<header><div class="gt"><b class="no">' + esc(m.from.hotel) + ' ← ' + esc(m.to.hotel) + '</b><div class="sub">' + T.ic + ' ' + T.ar + '</div></div><div class="gs">' + chip + '</div></header>' +
      '<div class="gbig"><div><b class="num">' + m.pax + '</b><span>حاج</span></div><div class="gcd"><span class="cd" data-w="' + trDate(m.date).getTime() + '"></span></div></div>' +
      (hasApr ? '<div class="bar"><i style="width:' + Math.round(st.ok / st.tot * 100) + '%"></i></div>' : '') + noteChip(m) + badge +
      '<dl class="gkv"><div><dt>التاريخ</dt><dd><b>' + esc(trDayTxt(m.date)) + '</b></dd></div>' +
      '<div><dt>من</dt><dd><b>' + esc(m.from.hotel) + '</b><div class="sub">' + esc(cityTxt(m.from)) + '</div></dd></div>' +
      '<div><dt>إلى</dt><dd><b>' + esc(m.to.hotel) + '</b><div class="sub">' + esc(cityTxt(m.to)) + '</div></dd></div>' +
      '<div><dt>الوسيلة</dt><dd>' + legs.map(l => legChip(m, l)).join(' ') + '</dd></div>' + trBusRows(m) + '</dl>' +
      '<footer>' + (hasApr ? '<button class="btn sm gold" data-mact="appr">🧾 اعتماد</button>' : '') + '<button class="btn sm sky" data-mact="pp">' + ICON.eye + 'الجوازات (' + m.pax + ')</button><button class="btn sm" data-mact="note" title="حالة النقل وملاحظة" aria-label="حالة النقل وملاحظة">📝</button><button class="btn sm" data-mact="share" title="مشاركة ملخص الحركة">📤 مشاركة</button></footer></article>';
  };

  const passes = m => {
    if (ui.type !== 'all' && m.type !== ui.type) return false;
    if (ui.day !== 'all' && m.date !== ui.day) return false;
    if (ui.city !== 'all' && m.from.city !== ui.city && m.to.city !== ui.city) return false;
    if (ui.ap === 'open' && !trOpenAppr(m)) return false;
    if (ui.q) {
      const q = C.normAr(ui.q);
      if (!C.normAr(m.from.hotel + ' ' + m.to.hotel).includes(q) && !m.pilgrims.some(r => C.normAr(r.passport + ' ' + nameOf(r)).includes(q))) return false;
    }
    return true;
  };

  function render() {
    const d = state.data.transfers, stale = $('#stale');
    if (!d) {
      stale.innerHTML = state.err.transfers ? '<div class="stale">⚠ ' + esc(state.err.transfers) + ' <button class="btn sm" id="stSet">الإعدادات</button></div>' : '';
      if ($('#stSet')) $('#stSet').onclick = () => openSettings(false);
      $('#kpis').innerHTML = '<div class="empty" style="grid-column:1/-1">' + (state.err.transfers ? 'تعذّر تحميل بيانات التنقلات.' : 'جارٍ تحميل البيانات…') + '</div>';
      $('#list').innerHTML = ''; $('#cnt').textContent = ''; return;
    }
    stale.innerHTML = state.err.transfers ? '<div class="stale">⚠ تعذّر التحديث الأخير (' + esc(state.err.transfers) + ') — تُعرض آخر بيانات محفوظة.</div>' : (d.warn ? '<div class="stale">⚠ ' + esc(d.warn) + '</div>' : '');
    const all = d.moves, sum = f => all.filter(f).reduce((n, m) => n + m.pax, 0), cnt = f => all.filter(f).length;
    let busTot = 0, busOk = 0, covered = 0;
    all.forEach(m => aprLegs(m).forEach(l => trBuses(m, l).forEach((b, i) => { busTot++; if (trOk(trKey(m, l, i))) { busOk++; covered += b.length; } })));
    $('#kpis').innerHTML =
      '<div class="kpi gold"><div class="l">إجمالي الانتقالات</div><div class="v">' + all.reduce((n, m) => n + m.pax, 0) + '</div><div class="s">انتقال حاج · ' + all.length + ' حركة · ' + d.records.length + ' حاج</div></div>' +
      '<div class="kpi ok"><div class="l">🚆 بالقطار بين المدن</div><div class="v">' + sum(m => m.type === 'train') + '</div><div class="s">' + cnt(m => m.type === 'train') + ' حركة</div></div>' +
      '<div class="kpi amber"><div class="l">🕋 فندق ↔ كدانة</div><div class="v">' + sum(m => m.type === 'mashaer') + '</div><div class="s">' + cnt(m => m.type === 'mashaer') + ' حركة بالحافلات</div></div>' +
      '<div class="kpi sky"><div class="l">🏨 فندق ← فندق</div><div class="v">' + sum(m => m.type === 'hotel') + '</div><div class="s">' + cnt(m => m.type === 'hotel') + ' حركة</div></div>' +
      '<div class="kpi red' + (busTot > busOk ? '' : '" style="--accent:var(--ok)') + '"><div class="l">🧾 حافلات الاعتماد (بين المدن)</div><div class="v">' + busOk + ' / ' + busTot + '</div><div class="s">معتمدة · ' + covered + ' حاج' + (busTot > busOk ? ' · المتبقي ' + (busTot - busOk) : '') + '</div></div>';

    const days = [...new Set(all.map(m => m.date))].sort();
    const fd = $('#fDay'); if (fd.dataset.n !== String(days.length) + days[0]) { fd.innerHTML = '<option value="all">كل الأيام</option>' + days.map(k => '<option value="' + k + '">' + esc(trDayTxt(k)) + '</option>').join(''); fd.dataset.n = String(days.length) + days[0]; }
    fd.value = ui.day;
    $('#qchips').innerHTML = [['all', 'الكل', ui.type === 'all' && ui.ap === 'all'], ['train', '🚆 قطار بين المدن', ui.type === 'train'], ['mashaer', '🕋 فندق ↔ كدانة', ui.type === 'mashaer'], ['hotel', '🏨 فندق ← فندق', ui.type === 'hotel'], ['open', '🧾 اعتماد غير مسجّل', ui.ap === 'open']]
      .map(c => '<button type="button" class="qc' + (c[2] ? ' on' : '') + '" data-qc="' + c[0] + '">' + c[1] + '</button>').join('');

    const shown = all.filter(passes);
    $('#cnt').textContent = shown.length + ' من ' + all.length + ' حركة';
    const byDay = new Map(); shown.forEach(m => { if (!byDay.has(m.date)) byDay.set(m.date, []); byDay.get(m.date).push(m); });
    $('#list').innerHTML = shown.length ? [...byDay.entries()].map(([k, ms]) => '<div class="trday"><h3>' + esc(trDayTxt(k)) + ' <span class="hint">' + ms.reduce((n, m) => n + m.pax, 0) + ' حاج · ' + ms.length + ' حركة</span></h3><div class="cards">' + ms.map(cardHtml).join('') + '</div></div>').join('')
      : '<div class="empty">لا توجد تنقلات مطابقة</div>';
    tick();
  }

  $('#fQ').oninput = e => { ui.q = e.target.value.trim(); render(); };
  $('#fDay').onchange = e => { ui.day = e.target.value; render(); };
  $('#fCity').onchange = e => { ui.city = e.target.value; render(); };
  $('#qchips').onclick = e => {
    const b = e.target.closest('[data-qc]'); if (!b) return; const v = b.dataset.qc;
    if (v === 'all') { ui.type = 'all'; ui.ap = 'all'; ui.day = 'all'; ui.city = 'all'; ui.q = ''; $('#fQ').value = ''; $('#fCity').value = 'all'; }
    else if (v === 'open') ui.ap = ui.ap === 'open' ? 'all' : 'open';
    else ui.type = ui.type === v ? 'all' : v;
    render();
  };
  const expRows = () => {
    const o = []; (state.data.transfers ? state.data.transfers.moves : []).filter(passes).forEach(m => {
      const veh = trLegs(m).map(l => l.kind === 'train' ? 'قطار' : l.kind === 'bus' ? 'حافلة (' + trBuses(m, l).length + ')' : 'سيارة').join(' + ');
      const busOf = {}; trLegs(m).filter(l => l.kind === 'bus').forEach(l => trBuses(m, l).forEach((b, i) => b.forEach(r => { (busOf[r.passport] = busOf[r.passport] || []).push((l.apr ? 'حافلة ' + (i + 1) + ' (' + b.length + ' فرد)' + (trOk(trKey(m, l, i)) ? ' ✓' : ' ✗') : 'حافلة ' + (i + 1) + ' (' + b.length + ' فرد)')); })));
      m.pilgrims.forEach((r, j) => o.push([m.date, TR_TYPES[m.type].ar, m.from.hotel, m.to.hotel, veh, j + 1, nameOf(r), r.passport || '', natTxt(r), (busOf[r.passport] || []).join(' / ')]));
    }); return o;
  };
  const EXH = ['التاريخ', 'النوع', 'من', 'إلى', 'الوسيلة', '#', 'الاسم', 'رقم الجواز', 'الجنسية', 'الحافلة (✓ معتمدة)'];
  const expMeta = () => ['المعروض حسب التصفية الحالية' + (ui.day !== 'all' ? ' — يوم ' + ui.day : '') + (ui.type !== 'all' ? ' — ' + TR_TYPES[ui.type].ar : ''), 'تاريخ الإصدار: ' + C.fmtDay(new Date())];
  $('#tX').onclick = () => { if (isMasked()) { toast('أرقام الجوازات مخفية — سجّل دخول المالك للتصدير', 'warn'); return; } const r = expRows(); if (!r.length) { toast('لا توجد بيانات للتصدير', 'warn'); return; } EXP.xlsx('transfers-' + (ui.day !== 'all' ? ui.day : 'all') + '-' + C.fmtDay(new Date()), 'التنقلات الداخلية', expMeta(), EXH, r); toast('تم إنشاء ملف Excel (' + r.length + ' صف)', 'ok'); };
  $('#tP').onclick = () => { if (isMasked()) { toast('أرقام الجوازات مخفية — سجّل دخول المالك للتصدير', 'warn'); return; } const r = expRows(); if (!r.length) { toast('لا توجد بيانات للتصدير', 'warn'); return; } EXP.pdf('التنقلات الداخلية', expMeta(), EXH, r); };
  $('#list').onclick = e => {
    const b = e.target.closest('[data-mact]'); if (!b) return;
    const card = b.closest('[data-mv]'), m = (state.data.transfers ? state.data.transfers.moves : [])[+(card && card.dataset.mv)]; if (!m) return;
    const a = b.dataset.mact;
    if (a === 'appr') openLegs(m, trLegs(m).filter(l => l.apr), 'appr');
    else if (a === 'pp') openPass(m);
    else if (a === 'note') openNote(m);
    else if (a === 'share') openShare(m);
  };
  onData(render); render();
}

/* =====================================================================
   صفحة «حاج»: عرض زمني موحّد (وصول ← إقامات ← تنقلات ← مغادرة) بالبحث بالجواز أو الاسم
   وصفحة «المتابعة»: تنبيهات + مؤشرات يومية للاستعداد والاعتماد والإنجاز
   ===================================================================== */
const pfAll = () => ({ A: state.data.arrival, D: state.data.departure, T: state.data.transfers });
const pfDay = d => d ? C.fmtDay(d) : '';
const pfWhen = d => d ? C.fmtDayAr(d) + ' ' + C.fmtTime(d) : '—';
const pfDayKeyTxt = k => (typeof trDayTxt === 'function' ? trDayTxt(k) : k);

function initPilgrim() {
  const app = $('#app'); let sel = '', q = '', idx = null, idxSrc = '';
  app.innerHTML = '<section class="hero"><div><h1>رحلة <span>الحاج</span></h1><p>ابحث برقم الجواز أو الاسم لترى مساره كاملاً: الوصول، الإقامات، التنقلات، المغادرة</p></div></section>' +
    '<div id="stale"></div><section class="panel"><div class="toolbar"><div class="field" style="flex:1;min-width:220px">' + ICON.search + '<input type="search" id="pQ" placeholder="رقم الجواز أو الاسم…" autocomplete="off" autofocus></div><span class="hint" id="pCnt"></span></div><div id="pRes"></div></section>';
  const build = () => {
    const { A, D, T } = pfAll(), tag = [A, D, T].map(x => x ? x.records.length : 0).join('|') + (isMasked() ? 'm' : '');
    if (idx && idxSrc === tag + (A && A.records) + (D && D.records) + (T && T.records)) return idx;

const CAP_LS = 'hajj1447.cap';
const capGet = () => { try { return JSON.parse(localStorage.getItem(CAP_LS) || '{}') || {}; } catch (e) { return {}; } };
function followData() {
  const { A, D, T } = pfAll(), now = Date.now(), alerts = [], H = 3600e3, day = {};
  const lateMs = (+S.lateH || 2) * H, lead = +lsGet('hajj1447.alertH') || 24;
  const dd = k => day[k] || (day[k] = { k, a: { pax: 0, done: 0, g: 0, reg: 0 }, d: { pax: 0, done: 0, f: 0, need: 0, ok: 0 }, t: { pax: 0, mv: 0, bus: 0, ok: 0 } });
  if (A) {
    C.groupRecords(A.records).forEach(g => {
      const k = pfDay(g.when) || '—', o = dd(k); o.a.pax += g.pax; o.a.done += g.done; o.a.g++; if (rdyReg(g)) o.a.reg++;
    });
    C.groupFlights(A.records).forEach(fg => {
      if (fg.when && fg.when.getTime() < now - lateMs && fg.done < fg.pax) {
        const h = Math.round((now - fg.when.getTime()) / H * 10) / 10;
        alerts.push({ lv: h > 6 ? 'red' : 'amber', ic: '⏱', t: 'رحلة وصول ' + fg.flight + ' متأخرة', d: 'مضى ' + h + ' ساعة على موعدها ولم يُسكَّن ' + (fg.pax - fg.done) + ' من ' + fg.pax + ' حاج', ts: fg.when.getTime(), link: 'arrival.html?flight=' + encodeURIComponent(fg.key) });
      }
    });
  }
  if (D) {
    const sm = apprStatusMap(D.records);
    C.groupFlights(D.records).forEach(fg => {
      const k = pfDay(fg.when) || '—', o = dd(k); o.d.pax += fg.pax; o.d.done += fg.done; o.d.f++;
      const need = C.groupRecords(fg.rows).some(g => (sm.get(g.key) || {}).ok);
      if (need) { o.d.need++; if (apprOkOf(fg)) o.d.ok++; else if (fg.when && fg.when.getTime() > now - 2 * H && fg.when.getTime() - now <= lead * H && fg.done < fg.pax) {
        const h = Math.max(0, Math.round((fg.when.getTime() - now) / H * 10) / 10);
        alerts.push({ lv: h <= 12 ? 'red' : 'amber', ic: '🧾', t: 'مغادرة ' + fg.flight + ' بلا اعتماد حافلة', d: 'تبقّى ' + h + ' ساعة على الرحلة (' + fg.pax + ' حاج)', ts: fg.when.getTime(), link: 'departure.html?flight=' + encodeURIComponent(fg.key) });
      } }
    });
  }
  const occ = {}; // فندق → يوم → عدد
  if (T) {
    T.moves.forEach(m => {
      const o = dd(m.date); o.t.pax += m.pax; o.t.mv++;
      trLegs(m).filter(l => l.apr).forEach(l => trBuses(m, l).forEach((b, i) => { o.t.bus++; const ok = trOk(trKey(m, l, i)); if (ok) o.t.ok++; else {
        const ts = trDate(m.date).getTime() - 12 * H;
        if (ts > now - 12 * H && ts - now <= lead * H) alerts.push({ lv: ts - now <= 12 * H ? 'red' : 'amber', ic: '🚌', t: 'حافلة تنقل بلا اعتماد — ' + m.from.hotel + ' ← ' + m.to.hotel, d: pfDayKeyTxt(m.date) + ' · ' + l.from + ' ← ' + l.to + ' · حافلة ' + (i + 1) + ' من ' + trBuses(m, l).length + ' (' + b.length + ' فرد)', ts, link: 'transfers.html' });
      } }));
    });
    T.records.forEach(r => r.stays.forEach(s => {
      if (!s.hotel || !s.inn || !s.out) return;
      for (let t = trDate(s.inn).getTime(), end = trDate(s.out).getTime(), n = 0; t < end && n < 60; t += 86400e3, n++) { const k = C.fmtDay(new Date(t)); (occ[s.hotel] = occ[s.hotel] || {})[k] = ((occ[s.hotel] || {})[k] || 0) + 1; }
    }));
  }
  const cap = capGet(), today = C.fmtDay(new Date(now));
  Object.keys(occ).forEach(h => { const c = +cap[h]; if (!c) return; Object.keys(occ[h]).sort().forEach(k => { if (k >= today && occ[h][k] > c) alerts.push({ lv: 'red', ic: '🏨', t: 'فندق ' + h + ' يتجاوز سعته', d: pfDayKeyTxt(k) + ': ' + occ[h][k] + ' حاج من سعة ' + c, ts: trDate(k).getTime(), link: '' }); }); });
  alerts.sort((a, b) => (a.lv === b.lv ? a.ts - b.ts : a.lv === 'red' ? -1 : 1));
  return { alerts, day, occ, cap };
}

  const groups = C.groupRecords(A), dmy = k => k ? k.slice(8, 10) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4) : '';
  const days = [...new Set(groups.filter(g => g.when).map(g => C.fmtDay(g.when)))].sort(), today = C.fmtDay(new Date());
  if (!days.length) { toast('لا توجد تواريخ وصول في البيانات', 'warn'); return; }
  let day = days.includes(today) ? today : (days.find(d => d > today) || days[days.length - 1]), O = drOpts();
  const ov = modal('<h3>📋 تقرير الوصول اليومي</h3><div class="set"><label>اليوم<select id="drDay">' + days.map(k => '<option value="' + k + '">' + esc(dmy(k)) + '</option>').join('') + '</select></label>' +
    '<label>الوصول المقدّر للوجهة = الهبوط + (ساعات)<input id="drLag" type="number" min="0" max="12" step="0.25" value="' + O.lag + '" dir="ltr"></label>' +
    '<label class="full">عبارة العنوان الفرعي<input id="drNote" type="text" value="' + esc(O.note) + '"></label></div>' +
    '<div class="hint" id="drInfo"></div><div class="dr-wrap"><div id="drPrev"></div></div><div class="act"><button class="btn green" id="drX">📊 Excel</button><button class="btn sky" id="drP">📄 PDF / طباعة</button><button class="btn" id="drClose">إغلاق</button></div>');
  ov.classList.add('wide'); $('#drDay', ov).value = day;
  let T = state.data.transfers;
  if (!T && !isMasked()) { $('#drInfo', ov).textContent = 'جارٍ تحميل تواريخ المغادرة من تبويب Transfers…'; try { await loadKind('transfers'); T = state.data.transfers; } catch (e) { } }
  const tmap = new Map(); if (T && !isMasked()) T.records.forEach(r => { if (r.passport) tmap.set(passKey(r.passport), r); });
  const outOf = g => {
    if (!tmap.size) return '';
    const cnt = new Map(), hn = C.normAr(g.hotel || '');
    g.rows.forEach(r => { const t = tmap.get(passKey(r.passport)); if (!t || !t.stays.length) return; const s = (hn && t.stays.find(x => C.normAr(x.hotel) === hn)) || t.stays[0]; if (s && s.out) cnt.set(s.out, (cnt.get(s.out) || 0) + 1); });
    let best = '', n = 0; cnt.forEach((v, k) => { if (v > n) { n = v; best = k; } }); return dmy(best);
  };
  const HD = ['الرقم', 'الطيران', 'رقم الرحلة', 'تاريخ ووقت الوصول', 'عدد الحجاج', 'مدينة الوصول', 'طريقة التنقل للوجهة', 'مدينة الوجهة', 'وقت الوصول المقدر', 'الفندق', 'المغادرة'];
  const build = () => {
    const lag = Math.max(0, +$('#drLag', ov).value || 0), note = $('#drNote', ov).value.trim(), d = $('#drDay', ov).value;
    try { localStorage.setItem(DR_LS, JSON.stringify({ lag, note })); } catch (e) { }
    const gs = groups.filter(g => g.when && C.fmtDay(g.when) === d).sort((a, b) => a.when - b.when || (a.flight > b.flight ? 1 : -1));
    const rows = gs.map((g, i) => {
      const eta = new Date(g.when.getTime() + lag * 36e5), tp = C.transportFor(g.airCity, g.stayCity, g.pax, busMin || 8);
      return [i + 1, g.airline || '', g.flight || '', dmy(d) + (g.approx ? '' : ' ' + C.fmtTime(g.when)), g.pax, g.airCityRaw || C.cityName(g.airCity, ''), tp ? C.TRANSPORT[tp].ar : '', g.stayCityRaw || C.cityName(g.stayCity, ''), g.approx ? '' : dmy(C.fmtDay(eta)) + ' ' + C.fmtTime(eta), g.hotel || '', outOf(g)];
    });
    const total = rows.reduce((n, r) => n + (+r[4] || 0), 0);
    const wd = new Intl.DateTimeFormat('ar-SA-u-nu-latn-ca-gregory', { timeZone: C.TZ_NAME, weekday: 'long' }).format(new Date(d + 'T12:00:00+03:00'));
    const sub = 'رحلات يوم ' + wd + ' ' + dmy(d).replace(/\//g, '-') + (note ? ' ' + note : '');
    return { rows, total, sub, d, note };
  };
  const tableHtml = (R, print) => '<table class="drt"><thead><tr>' + HD.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    (R.rows.length ? R.rows.map(r => '<tr>' + r.map((v, j) => '<td' + (j === 9 ? ' class="hl"' : '') + '>' + esc(v) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + HD.length + '">لا توجد رحلات في هذا اليوم</td></tr>') +
    '</tbody><tfoot><tr><td colspan="' + HD.length + '"><b>' + R.total + '</b></td></tr></tfoot></table>';
  let R = null;
  const draw = () => { R = build(); $('#drInfo', ov).textContent = R.rows.length + ' رحلة · ' + R.total + ' حاج' + (tmap.size ? '' : (isMasked() ? ' · عمود المغادرة يحتاج صلاحية رؤية الجوازات' : ' · لا تتوفر تواريخ المغادرة (تبويب Transfers)')); $('#drPrev').innerHTML = '<h4 class="drh">رحلات الوصول لحج 1447</h4><div class="drs">' + esc(R.sub) + '</div>' + tableHtml(R); };
  ['drDay', 'drLag', 'drNote'].forEach(id => $('#' + id, ov).addEventListener('input', draw)); draw();
  $('#drClose', ov).onclick = () => ov.close();
  $('#drX', ov).onclick = () => { EXP.xlsx('arrival-report-' + R.d, 'رحلات الوصول لحج 1447', [R.sub], HD, R.rows.concat([['', '', '', 'الإجمالي', R.total, '', '', '', '', '', '']])); toast('تم إنشاء ملف Excel', 'ok'); };
  $('#drP', ov).onclick = async () => {
    const css = '.drpdf{font-family:Tajawal,Tahoma,Arial,sans-serif;color:#000;background:#fff;direction:rtl;padding:4px}.drpdf h1{text-align:center;font-size:20px;margin:4px 0 2px;font-weight:600}.drpdf .s{text-align:center;font-size:14px;margin:0 0 8px}.drpdf table{width:100%;border-collapse:collapse;font-size:11px}.drpdf th{background:#4faa3c;color:#fff;padding:6px 3px;border:1px solid #fff;font-weight:600}.drpdf td{padding:4px;text-align:center;border:1px solid #cfe8c8}.drpdf tbody tr:nth-child(odd) td{background:#dff1d9}.drpdf tbody tr:nth-child(even) td{background:#fff}.drpdf td.hl{font-size:10px}.drpdf tfoot td{border:1px solid #4faa3c;font-size:13px;padding:5px;background:#fff}';
    const frag = '<div class="drpdf" dir="rtl"><style>' + css + '</style><h1>رحلات الوصول لحج 1447</h1><div class="s">' + esc(R.sub) + '</div>' + tableHtml(R, true) + '</div>';
    toast('جارٍ تجهيز PDF…');
    try { await savePDF(frag, 'arrival-report-' + R.d + '.pdf', true); toast('تم إنشاء PDF', 'ok'); } catch (e) { toast('تعذّر إنشاء PDF: ' + (e.message || e), 'err'); }
  };
}

async function boot() {
  let th = 'dark'; try { th = localStorage.getItem(LS_THEME) || 'dark'; } catch (e) { }
  document.documentElement.dataset.theme = th;
  const page = document.body.dataset.page;
  kindsInUse = page === 'index' ? ['arrival', 'departure'] : (page === 'pilgrim' || page === 'follow') ? ['arrival', 'departure', 'transfers'] : page === 'transfers' ? ['transfers', 'arrival'] : [page];
  const startUi = () => { if (page === 'index') initDashboard(); else if (page === 'transfers') initTransfers(); else if (page === 'pilgrim') initPilgrim(); else if (page === 'follow') initFollow(); else initTracker(page); };
  // مسار سريع: إن وُجدت إعدادات وبيانات محفوظة تُعرض فوراً دون انتظار الخادم، ثم يُحدَّث في الخلفية
  let early = false;
  try {
    const fixed = window.HAJJ_CONFIG && window.HAJJ_CONFIG.webapp, pub = JSON.parse(localStorage.getItem(LS_PUB) || 'null');
    if (typeof fixed === 'string' && WEB_RE.test(fixed) && CONN.webapp === fixed && pub && pub.configured && pub.settings) {
      REMOTE.locked = true; REMOTE.configured = true; applyRemote(pub.settings);
      renderNav(page); initInstall(); hydrate(kindsInUse); startUi(); early = true;
    }
  } catch (e) { early = false; console.error('fast-path', e && e.stack || e); }
  await initConnection();
  if (!early) { renderNav(page); initInstall(); if (REMOTE.configured) hydrate(kindsInUse); else if (!REMOTE.error) clearCaches(); startUi(); }
  else { if (!REMOTE.configured) { clearCaches(); kindsInUse.forEach(k => { state.data[k] = null; }); } updateRole(); emit(); }
  setInterval(() => tick(), 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && sourceReady() && Date.now() - lastTry > S.refreshSec * 1000) refresh(); });
  if (!CONN.webapp) { openConnect(); return; }
  if (!REMOTE.configured) {
    const msg = REMOTE.error || 'المنظومة لم تُهيّأ بعد — يحتاج المالك إلى ضبط الإعدادات';
    kindsInUse.forEach(k => { state.err[k] = msg; }); emit();
    if (REMOTE.owner) openSettings(true);
    return;
  }
  refresh(); startAuto(); updateBadges();
}
document.addEventListener('DOMContentLoaded', boot);
})();

</script>
